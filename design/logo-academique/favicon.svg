<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Favicon BIBLIO — version petite taille : pas d'étiquette sur le dos, traits calés sur la grille 2 px (=1 px à 16 px).
       Pastille pleine : lisible sur barre d'onglets claire comme sombre. -->
  <style>
    .t{fill:#1f3a5f}.i{fill:#ffffff}.a{fill:#c9b46f}
    @media (prefers-color-scheme: dark){.t{fill:#88b4e3}.i{fill:#0f1620}.a{fill:#7a6321}}
  </style>
  <rect class="t" width="32" height="32" rx="6"/>
  <g class="i">
    <rect x="6" y="9" width="4" height="15"/>
    <rect x="12" y="6" width="4" height="18"/>
    <rect x="18" y="11" width="4" height="13"/>
    <rect x="4" y="24" width="24" height="2"/>
  </g>
  <rect class="a" x="25.2" y="11" width="4" height="13" transform="rotate(-14 25.2 24)"/>
</svg>
