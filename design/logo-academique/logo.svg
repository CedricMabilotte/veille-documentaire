<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" color="#1a2233" aria-hidden="true">
  <!-- BIBLIO — marque « rayonnage commun » (thème Académique).
       Trois dos sur une tablette partagée ; le quatrième, penché, est le livre qui circule.
       Encre : currentColor. Livre qui circule : var(--brand-accent), repli or #7a6321.
       Usage recommandé : <svg class="brand-mark"><use href="assets/img/logo.svg#mark"/></svg>
       (hérite de color et de --brand-accent de la page, donc suit clair/sombre). -->
  <g id="mark">
    <g fill="currentColor">
      <rect x="5" y="8" width="4" height="18"/>
      <path fill-rule="evenodd" d="M11 4h4v22h-4z M12 8h2v3h-2z"/>
      <rect x="17" y="10" width="4" height="16"/>
      <rect x="3" y="26" width="26" height="2"/>
    </g>
    <rect x="25" y="10" width="4" height="16" transform="rotate(-14 25 26)" style="fill:var(--brand-accent,#7a6321)"/>
  </g>
</svg>
