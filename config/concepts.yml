# ─────────────────────────────────────────────────────────────────────────────
# concepts.yml — Ontologie formalisée de BIBLIO
# ─────────────────────────────────────────────────────────────────────────────
# Thématique : communs fonciers, propriété d'usage, libération des terres,
# paysanneries. Voix éditoriale militante-académique.
# Ce fichier est lu par le scoreur Claude (intégration : synopsis_enricher.py).
# ─────────────────────────────────────────────────────────────────────────────

project:
  name: "communs-terres-paysannerie"
  display_name: "BIBLIO — Communs, terres, paysanneries"
  tagline: "Bibliothèque documentaire ouverte sur les communs, la propriété d'usage et les paysanneries."
  description: >
    BIBLIO veille sur les écritures qui pensent la terre autrement : sortie de
    la propriété privée par la propriété d'usage et les fonds de dotation,
    réinvention des communs fonciers, luttes paysannes et de sans-terre,
    agriculture vivrière, réformes agraires et souverainetés alimentaires.
    Le corpus croise archives anarchistes, recherches universitaires
    (HAL, Archive.org), infokiosques francophones et bibliothèques militantes
    multilingues. L'intention éditoriale est d'outiller militant·es, chercheur·ses
    et journalistes avec une bibliothèque vivante, située et critique.
  # PT ajouté pour la couverture MST/Brésil et lusophonie en général.
  languages: [fr, en, es, pt]

# ─────────────────────────────────────────────────────────────────────────────
# Ontologie : ce qui définit la thématique
# ─────────────────────────────────────────────────────────────────────────────
ontology:
  core_concepts:
    - name: "Propriété d'usage"
      definition: >
        Forme de propriété alternative qui dissocie le droit d'usage du droit
        de disposition marchande. Inclut les fonds de dotation, les baux
        emphytéotiques militants, les fiducies foncières, les structures
        anti-spéculatives.
      equivalents:
        fr: ["propriété d'usage", "fonds de dotation", "fiducie foncière", "bail emphytéotique militant", "propriété collective", "usufruit collectif"]
        en: ["usufruct", "community land trust", "collective ownership", "use rights", "stewardship ownership"]
        es: ["usufructo", "propiedad de uso", "fideicomiso de tierras", "tenencia colectiva"]
        pt: ["usufruto", "propriedade de uso", "fideicomisso de terras"]

    - name: "Communs fonciers"
      definition: >
        Régimes de propriété ou d'usage où la terre est gérée par et pour une
        communauté, hors du marché et de la propriété étatique exclusive.
        Inclut communaux, ejidos, terres coutumières, biens communaux.
      equivalents:
        fr: ["communs fonciers", "communaux", "biens communs", "terres collectives", "terres communales", "commun(s)"]
        en: ["land commons", "commoning", "commons", "common lands", "common-pool resources"]
        es: ["bienes comunes", "tierra comunal", "ejidos", "comunales", "usos colectivos"]
        pt: ["bens comuns", "terras comuns", "terras coletivas"]

    - name: "Communs urbains & habitat coopératif"
      definition: >
        Formes urbaines de communs : community land trusts, fiducies foncières
        solidaires, coopératives d'habitants, AMAP urbaines, logement collectif
        sorti de la spéculation, habitat groupé. À condition d'un ancrage foncier
        clair (le bâti repose sur une terre dont le statut est en jeu).
      equivalents:
        fr: ["communs urbains", "fiducies foncières solidaires", "AMAP", "habitat coopératif", "habitat groupé", "logement collectif", "coopératives d'habitants"]
        en: ["urban commons", "community land trust", "housing commons", "housing cooperative", "limited equity cooperative", "co-housing"]
        es: ["comunes urbanos", "vivienda colectiva", "vivienda cooperativa", "cooperativas de vivienda", "fideicomiso urbano"]
        pt: ["bens comuns urbanos", "moradia coletiva", "cooperativas de moradia"]

    - name: "Libération des terres"
      definition: >
        Mouvements et théories qui visent la décolonisation, redistribution
        ou occupation des terres : sans-terre, Land Back, réformes agraires,
        luttes contre l'enclosure et l'accaparement.
      equivalents:
        fr: ["libération des terres", "accès à la terre", "luttes pour la terre", "réforme agraire", "accaparement", "accaparement des terres", "ZAD"]
        en: ["land liberation", "land back", "landless movement", "land rights", "agrarian reform", "land grabbing", "land grabs", "enclosure"]
        es: ["liberación de la tierra", "sin tierra", "reforma agraria", "tierra y libertad", "acaparamiento de tierras", "acaparamiento"]
        pt: ["libertação da terra", "sem terra", "reforma agrária", "MST", "Movimento Sem Terra"]

    - name: "Mouvements autochtones & Land Back"
      definition: >
        Luttes de peuples autochtones pour la restitution, la souveraineté et
        l'autonomie territoriale. Inclut Land Back en Amérique du Nord, terras
        indígenas au Brésil, sumak kawsay andin, autonomies zapatistes,
        revendications coutumières en Afrique et Océanie.
      equivalents:
        fr: ["land back", "luttes autochtones", "souveraineté autochtone", "autonomie territoriale", "peuples premiers", "droit coutumier"]
        en: ["land back", "indigenous land rights", "land repatriation", "indigenous sovereignty", "first nations", "customary tenure"]
        es: ["comunidades originarias", "pueblos originarios", "autonomía territorial", "sumak kawsay", "buen vivir", "soberanía indígena"]
        pt: ["terra indígena", "povos originários", "demarcação", "autonomia territorial"]

    - name: "Paysannerie & agroécologie"
      definition: >
        Mondes paysans comme acteurs politiques, économiques et culturels :
        agricultures vivrières, savoirs paysans, agroécologie politique,
        souveraineté alimentaire, organisations comme la Via Campesina ou le MST.
        À distinguer de l'agriculture industrielle.
      equivalents:
        fr: ["paysannerie", "paysans libres", "agriculture vivrière", "agroécologie", "agroécologie paysanne", "souveraineté alimentaire", "paysannerie familiale", "agriculture familiale"]
        en: ["peasantry", "peasant movement", "subsistence farming", "agroecology", "food sovereignty", "peasant agroecology", "smallholder", "family farming", "peasant agriculture"]
        es: ["campesinado", "agricultura campesina", "agroecología", "soberanía alimentaria", "agroecología campesina", "agricultura familiar"]
        pt: ["camponeses", "agricultura camponesa", "agroecologia", "soberania alimentar", "agricultura familiar"]

    - name: "Féminisme agraire & paysan"
      definition: >
        Approches féministes du foncier et de la paysannerie : place des
        femmes dans les luttes pour la terre, droits fonciers des femmes,
        organisations comme la Marche mondiale des femmes (axe rural),
        critique de la division genrée du travail agricole.
      equivalents:
        fr: ["féminisme paysan", "féminisme agraire", "droits fonciers des femmes", "femmes et terre"]
        en: ["agrarian feminism", "peasant feminism", "women land rights", "feminist political ecology"]
        es: ["feminismo agrario", "feminismo campesino", "derechos de las mujeres a la tierra"]
        pt: ["feminismo agrário", "feminismo camponês"]

    - name: "Communs africains & foncier coutumier"
      definition: >
        Régimes fonciers coutumiers africains : titres collectifs, gestion
        communautaire des terres, conflits avec les codes fonciers étatiques
        importés, résistances aux concessions et land grabs en Afrique de
        l'Ouest, Centrale, et Est.
      equivalents:
        fr: ["foncier coutumier", "biens communs africains", "droit coutumier", "tenure communautaire africaine"]
        en: ["African commons", "customary tenure", "customary land rights", "African land rights"]
        es: ["tenencia consuetudinaria", "bienes comunes africanos"]
        pt: ["posse costumeira", "bens comuns africanos"]

    - name: "Coopératives & mutualisme foncier"
      definition: >
        Coopératives agricoles, mutuelles foncières, structures collectives
        d'exploitation et d'achat de la terre. Inclut SCI militantes, GFA
        mutuels, foncières solidaires, agricultural cooperatives, cooperativas
        agrarias historiques (mouvement coopératif espagnol, italien, etc.).
      equivalents:
        fr: ["coopérative agricole", "mutualisme foncier", "foncière solidaire", "GFA mutuel", "Terre de Liens"]
        en: ["agricultural cooperatives", "land cooperative", "cooperative farming", "land trust mutual"]
        es: ["cooperativas agrarias", "cooperativas agrícolas", "mutualismo agrario"]
        pt: ["cooperativas agrícolas", "cooperativismo rural"]

    - name: "Habitat et collectifs"
      definition: >
        Formes collectives d'habiter la terre : habitat groupé, communautés
        intentionnelles, occupations, squats ruraux, coopératives d'habitants.
        À condition d'avoir un rapport SITUÉ à la terre (pas juste à l'immobilier).
      equivalents:
        fr: ["collectif d'habitants", "habitat groupé", "communautés rurales", "squat rural", "coopérative d'habitants"]
        en: ["housing cooperative", "intentional community", "land cooperative", "rural commune"]
        es: ["cooperativa de vivienda", "comunidad intencional", "comuna rural"]
        pt: ["cooperativa de moradia", "comunidade intencional", "comuna rural"]

  related_concepts:
    - "écologie politique"
    - "décolonial / décolonisation"
    - "anarchisme (en tant qu'il pense la terre)"
    - "altermondialisme"
    - "luttes autochtones"
    - "permaculture (lorsqu'elle est politique, pas technique)"
    - "histoire rurale"
    - "géographie radicale"
    - "agroécologie politique"
    - "peasant agriculture / agricultura familiar / family farming"
    - "smallholder / petite agriculture paysanne"
    - "paysannerie familiale"
    - "écoféminisme rural"
    - "économie sociale et solidaire agricole"

  anti_concepts:
    - "immobilier spéculatif / placement foncier individuel"
    - "agriculture industrielle / agro-industrie (sauf en critique)"
    - "anarchisme purement urbain et insurrectionnel (sans rapport à la terre)"
    - "économie collaborative / sharing economy de plateformes"
    - "gestion patrimoniale type 'commun' au sens propriété privée individuelle"
    - "ruralité folklorique / passéisme rural"
    - "écologie technocratique (green tech, marché du carbone)"
    - "libertarianism US (anti-tax, anti-state, capitalisme libertarien) — à NE PAS confondre avec libertaire FR"
    - "cryptocurrencies / NFT / Web3 (y compris quand maquillés en 'commons')"
    - "libertaire abstrait / philosophie libertaire sans ancrage foncier ou paysan"
    - "antifascisme général sans dimension foncière, agraire ou territoriale"
    - "tokenisation foncière / 'real estate on blockchain'"
    - "land banking spéculatif"

# ─────────────────────────────────────────────────────────────────────────────
# Choix éditoriaux : voix, audience, ton
# ─────────────────────────────────────────────────────────────────────────────
editorial:
  voice: "militant+académique"

  # PT ajouté : Brésil/MST/lusophonie est un axe majeur des luttes pour la terre.
  languages: [fr, en, es, pt]

  audience: >
    Militant·es des luttes foncières et paysannes, chercheur·ses en sciences
    sociales (sociologie rurale, géographie, histoire), journalistes
    indépendant·es, juristes des communs, étudiant·es en agroécologie politique.

  tone_examples:
    - "Un texte qui prend la terre au sérieux comme objet politique, pas comme décor."
    - "L'auteur·e propose une généalogie des enclosures qui éclaire les accaparements contemporains."
    - "Court, dense, situé — une critique pratique de la propriété privée par celles et ceux qui l'expérimentent."
    - "Une enquête de terrain qui ne romantise pas la paysannerie mais en restitue les conflits internes."

# ─────────────────────────────────────────────────────────────────────────────
# Paramètres de scoring
# ─────────────────────────────────────────────────────────────────────────────
scoring:
  threshold: 7
  strict_mode: true

  custom_examples:
    - title_example: "Communs fonciers : propriété d'usage et fonds de dotation comme outils anti-spéculatifs"
      score: 9
      reason: >
        Touche frontalement à deux core_concepts (communs fonciers + propriété d'usage),
        avec un cadrage politique anti-spéculatif explicite.

    - title_example: "La libération des terres au Brésil : MST, Via Campesina, agroécologie"
      score: 9
      reason: >
        Croise libération des terres + paysannerie + acteurs collectifs situés.
        Type même de l'entrée centrale du corpus.

    - title_example: "Habiter autrement : éco-hameaux et communautés intentionnelles en France"
      score: 7
      reason: >
        Habitat et collectifs (core), mais à valider qu'il y a bien un rapport à la terre
        et pas seulement un modèle immobilier alternatif.

    - title_example: "Community Land Trusts as Urban Commons: Housing Beyond Speculation"
      score: 9
      reason: >
        Core concept 'Communs urbains & habitat coopératif' frontal, cadrage
        anti-spéculatif et institutionnel-pratique. Pile au cœur de la
        nouvelle ouverture EN du corpus.

    - title_example: "Land Back: Indigenous Sovereignty and the Critique of Settler Property"
      score: 9
      reason: >
        Core 'Mouvements autochtones & Land Back' + critique de la propriété
        coloniale. Combine deux axes structurants du projet.

    - title_example: "Mujeres campesinas y soberanía alimentaria : feminismo agrario en América Latina"
      score: 9
      reason: >
        Triple intersection : féminisme agraire + souveraineté alimentaire +
        ancrage latino-américain. Comble explicitement un angle mort identifié.

    - title_example: "Investir dans la nature : guide du placement foncier vert"
      score: 1
      reason: >
        Anti-concept frontal — placement foncier individuel maquillé en écologie.
        Vocabulaire 'foncier' / 'nature' trompeur.

    - title_example: "L'anarchie : une critique de l'État et du salariat"
      score: 4
      reason: >
        Concept related ('anarchisme') mais sans ancrage dans la terre, l'usage,
        le foncier. Hors-champ malgré le vocabulaire proche du corpus.

    - title_example: "Optimisation fiscale des fonds de dotation pour l'épargnant"
      score: 2
      reason: >
        Faux ami sur 'fonds de dotation' — ici purement fiscal, sans dimension
        militante ni anti-spéculative.

    - title_example: "Libertarianism and the Free Market: A Defense of Property Rights"
      score: 1
      reason: >
        Anti-concept ajouté — libertarianism US au sens anti-État pro-marché.
        Le mot 'property rights' ne suffit pas : ici il s'agit de défendre la
        propriété privée individuelle, pas de la critiquer.

    - title_example: "Tokenizing Farmland: Real Estate on the Blockchain"
      score: 1
      reason: >
        Anti-concept tokenisation foncière. Maquillage 'innovation' d'une
        marchandisation accrue de la terre.

# ─────────────────────────────────────────────────────────────────────────────
# Dossiers éditoriaux (item A7) — nommés par lutte, avec chapô écrit.
# scripts/editorial.py rattache les documents du catalog à ces dossiers via
# les `keywords` (matching insensible à la casse sur titre/résumé/raisons).
# ─────────────────────────────────────────────────────────────────────────────
dossiers:
  - slug: sortir-une-terre-du-marche
    titre: "Sortir une terre du marché"
    chapo: >
      Comment des collectifs arrachent durablement des terres à la
      spéculation : fonds de dotation, fiducies foncières, baux
      emphytéotiques militants, propriété d'usage. Les outils juridiques et
      financiers de l'inaliénabilité, racontés par celles et ceux qui les
      forgent.
    keywords:
      - propriété d'usage
      - fonds de dotation
      - fiducie foncière
      - terre de liens
      - bail emphytéotique
      - anti-spéculat
      - inaliénab
      - foncière solidaire
      - community land trust
      - stewardship

  - slug: zad-defense-de-territoires
    titre: "ZAD & défense de territoires"
    chapo: >
      Occuper pour défendre : ZAD, luttes contre les grands projets inutiles,
      résistances à l'artificialisation. Des récits de territoires habités
      contre l'aménagement, et ce qu'ils inventent en commun.
    keywords:
      - zad
      - zone à défendre
      - grand projet inutile
      - notre-dame-des-landes
      - occupation
      - artificialisation
      - aéroport
      - autoroute
      - bassines
      - défense de territoire

  - slug: sans-terre-reforme-agraire
    titre: "Sans-terre & réforme agraire"
    chapo: >
      La terre à celles et ceux qui la travaillent. Mouvements de sans-terre,
      réformes agraires, occupations de latifundios, MST brésilien et Via
      Campesina : la redistribution foncière comme combat vivant.
    keywords:
      - sans-terre
      - sans terre
      - réforme agraire
      - reforma agraria
      - mst
      - via campesina
      - latifundi
      - occupation de terre
      - landless
      - agrarian reform

  - slug: communs-fonciers-histoire
    titre: "Communs fonciers : une histoire"
    chapo: >
      Communaux, biens communaux, terres collectives : une longue histoire
      des régimes fonciers partagés, de leur enclosure et de leurs
      résurgences. Pour penser les communs autrement qu'en nostalgie.
    keywords:
      - communaux
      - biens communaux
      - communs fonciers
      - terres collectives
      - terres communales
      - enclosure
      - commons
      - common lands

  - slug: habitat-collectif-cooperatif
    titre: "Habitat collectif & coopératif"
    chapo: >
      Habiter la terre autrement : coopératives d'habitants, habitat groupé,
      communautés intentionnelles, squats ruraux. Des formes de logement
      sorties de la spéculation et ancrées dans un sol partagé.
    keywords:
      - habitat coopératif
      - habitat groupé
      - coopérative d'habitants
      - logement collectif
      - communauté intentionnelle
      - squat rural
      - co-housing
      - housing cooperative

  - slug: paysanneries-agroecologie
    titre: "Paysanneries & agroécologie politique"
    chapo: >
      Les mondes paysans comme acteurs politiques : agricultures vivrières,
      savoirs paysans, agroécologie comme projet de société, souveraineté
      alimentaire. Loin de l'agro-industrie et du folklore rural.
    keywords:
      - paysannerie
      - paysan
      - agroécologie
      - agriculture vivrière
      - souveraineté alimentaire
      - agriculture paysanne
      - peasant
      - agroecology
      - food sovereignty

  - slug: land-back-autochtones
    titre: "Land Back & souverainetés autochtones"
    chapo: >
      Restituer la terre aux peuples premiers : Land Back en Amérique du
      Nord, terras indígenas, autonomies territoriales. La critique de la
      propriété coloniale et les luttes pour la souveraineté.
    keywords:
      - land back
      - autochtone
      - peuples premiers
      - indigène
      - terra indígena
      - first nations
      - indigenous
      - souveraineté autochtone
      - droit coutumier

  - slug: feminismes-de-la-terre
    titre: "Féminismes de la terre"
    chapo: >
      Le foncier a un genre. Place des femmes dans les luttes agraires,
      droits fonciers des femmes, écoféminisme rural, critique de la division
      genrée du travail de la terre.
    keywords:
      - féminisme paysan
      - féminisme agraire
      - écoféminisme
      - droits fonciers des femmes
      - femmes et terre
      - mujeres campesinas
      - agrarian feminism

  - slug: accaparements-resistances
    titre: "Accaparements & résistances"
    chapo: >
      L'autre face du foncier : land grabbing, concessions, accaparements au
      Sud comme au Nord, et les résistances qui s'y opposent. Enquêtes et
      contre-cartographies.
    keywords:
      - accaparement
      - land grab
      - acaparamiento
      - concession foncière
      - enclosure
      - extractivis
      - mégaprojet

  - slug: cooperatives-mutualisme
    titre: "Coopératives & mutualisme foncier"
    chapo: >
      S'associer pour la terre : coopératives agricoles, GFA mutuels,
      foncières solidaires, mutuelles. Une économie de la terre fondée sur
      l'entraide plutôt que sur la rente.
    keywords:
      - coopérative agricole
      - mutualisme foncier
      - gfa
      - foncière solidaire
      - cooperativa
      - mutuelle
      - cooperative farming
