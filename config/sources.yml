  # ═══ Playwright — désactivé pour le moment ═════════════════════════════════
  # Les 4 sources Playwright testées (Via Campesina, Lundi.am, Reporterre,
  # Commons Strategies) sont des sites d'ARTICLES HTML lisibles en ligne,
  # pas des bibliothèques de PDFs. Le rendu JS n'expose aucun lien .pdf
  # → 0 doc/run. À réactiver si on identifie des sites JS qui exposent
  # vraiment des PDFs dans leur DOM rendu.
  #
  # L'infrastructure (scripts/parsers/playwright_parser.py + workflow Chromium)
  # reste en place et prête à l'emploi.

