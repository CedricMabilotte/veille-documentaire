    url: "https://cras31.info/"
    type: deep_html
    max_pages: 25
    min_interval_days: 14

  # ═══ OPDS — The Anarchist Library (multi-langues, gros corpus) ══════════════
  # RECALIBRAGE : l'URL racine /opds renvoyait juste la nav (New/Titles/
  # Authors/Topics) sans entries de livres. On pointe directement sur /new
  # (acquisition feed = vraies entrées avec download links).
  - label: "The Anarchist Library — OPDS (new releases)"
    url: "https://theanarchistlibrary.org/opds/new"
    type: opds
    min_interval_days: 14

  # ═══ API Archive.org — corpus anarchiste / paysanneries (multi-langues) ════
  - label: "Archive.org — Cuba (ES, réforme agraire & coopératives)"
    url: "https://archive.org/advancedsearch.php?q=cuba+AND+language%3A%22spa%22+AND+%28cooperativ*+OR+campesin*+OR+agrari*+OR+%22reforma+agraria%22%29+AND+mediatype%3Atexts&fl%5B%5D=identifier&fl%5B%5D=title&fl%5B%5D=creator&fl%5B%5D=description&output=json&rows=30"
    type: archive_org
    min_interval_days: 30

  # RECALIBRAGE : subject:anarchism trop large → bruit (CIA Reading Room etc).
  # On force subject ET un terre/paysannerie ET langue/année.
