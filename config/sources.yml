    type: archive_org
    min_interval_days: 14

  # ═══ API HAL Science — académique francophone ═══════════════════════════════
  - label: "HAL — communs fonciers"
    url: "https://api.archives-ouvertes.fr/search/?q=communs+fonciers&fl=title_s,uri_s,fileMain_s,language_s,authFullName_s,abstract_s&wt=json&rows=50"
    type: hal
    min_interval_days: 14

  - label: "HAL — paysannerie / agriculture vivrière"
    url: "https://api.archives-ouvertes.fr/search/?q=paysannerie+OR+%22agriculture+vivri%C3%A8re%22&fl=title_s,uri_s,fileMain_s,language_s,authFullName_s,abstract_s&wt=json&rows=50"
