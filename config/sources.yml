# ── Seuil de pertinence ─────────────────────────────────────────────────────
# Avec le prompt durci, threshold=7 garde un corpus très qualitatif.
# Si tu veux élargir : 6 ; si tu veux ultra-strict : 8.
threshold: 7

# ── Mots-clés de veille (multilingues FR + EN + ES + DE + PT) ────────────────
# Thématique CIBLÉE : propriété d'usage, communs fonciers, libération des
# terres, paysannerie, formes de propriété alternatives.
#
# Mots-clés trop génériques retirés (communauté, community, comunidad,
# propriété privée) — ils matchaient trop de hors-sujet libertaire général.
keywords:
  # ── Français — concepts pointus ─────────────────────────────────────────
  - propriété d'usage
  - fonds de dotation
  - libération des terres
  - communs fonciers
  - communaux
  - accès à la terre
  - sans-terre
  - paysans libres
  - collectif d'habitants
  - paysannerie
  - agriculture vivrière
  - vivrier
  - réforme agraire
  - souveraineté alimentaire
  - terres collectives
  - propriété collective
  - agroécologie
  - accaparement
  - accaparement des terres
  - fiducie foncière
  - foncier coutumier
  - droit coutumier
  - coopérative agricole
  - mutualisme foncier
  - féminisme paysan
  - paysannerie familiale
  - habitat coopératif
  - logement collectif
  - AMAP
  - communs urbains
  - autonomie territoriale
  - biens communs africains
  # ── English — concepts pointus ──────────────────────────────────────────
  - land commons
  - usufruct
  - land rights
  - land liberation
  - landless movement
  - peasantry
  - subsistence farming
  - food sovereignty
  - agrarian reform
  - commoning
  - enclosure
  - collective ownership
  - land back
  - land grabbing
  - land grabs
  - agroecology
  - community land trust
  - housing commons
  - housing cooperative
  - agricultural cooperatives
  - smallholder
  - peasant agriculture
  - family farming
  - indigenous land rights
  - land repatriation
  - agrarian feminism
  - women land rights
  - African commons
  - customary tenure
  - rural commons
  # ── Español — concepts pointus ──────────────────────────────────────────
  - bienes comunes
  - usufructo
  - liberación de la tierra
  - sin tierra
  - campesinado
  - soberanía alimentaria
  - reforma agraria
  - tierra y libertad
  - usos colectivos
  - ejidos
  - tierra comunal
  - agroecología
  - acaparamiento de tierras
  - acaparamiento
  - vivienda colectiva
  - cooperativas agrarias
  - comunidades originarias
  - autonomía territorial
  - sumak kawsay
  - buen vivir
  - feminismo agrario
  - agricultura familiar
  - agricultura campesina
  - tenencia colectiva
  - movimiento sin tierra
  # ── Português (BR / MST / lusophone) ────────────────────────────────────
  - Movimento Sem Terra
  - MST
  - reforma agrária
  - agroecologia
  - terra indígena
  - soberania alimentar
  - agricultura familiar
  # ── Deutsch — pour Böll Stiftung ────────────────────────────────────────
  - Landrechte
  - Bodenreform
  - Allmende
  - Gemeingüter
  - Landgrabbing
  - Kleinbauern
  - Ernährungssouveränität
  - Agrarökologie
  - bäuerliche Landwirtschaft

# ── Sources à surveiller ─────────────────────────────────────────────────────
# Champ `type` : html (défaut) | deep_html | opds | archive_org | hal
# Type non spécifié → html (rétrocompat)
sources:
  # ═══ Infokiosques.net — corpus francophone (html direct) ═══════════════════
  # RECALIBRAGE 2026-05-18 : les indexes alphabétiques (A, C, T, L) étaient
  # stériles (≥3 scans, 0 doc) car trop génériques et non alignés sur la
  # thématique. Remplacés par les vrais index THÉMATIQUES de SPIP, alignés
  # sur les core_concepts (paysannerie, écologie, anticap, squat, anticolo).
  # Vérifiés : 80-150 PDFs par index. Page "nouveautés" passe en deep_html
  # pour suivre les liens vers les nouvelles brochures.

  - label: "Infokiosques.net — nouveautés (deep crawl)"
    url: "https://infokiosques.net/"
    type: deep_html
    max_pages: 15
    min_interval_days: 3

  - label: "Infokiosques.net — Paysannerie & ruralité"
    url: "https://infokiosques.net/paysannerie_ruralite"
    type: html
    min_interval_days: 14

  - label: "Infokiosques.net — Écologie radicale"
    url: "https://infokiosques.net/ecologie_radicale"
    type: html
    min_interval_days: 14

  - label: "Infokiosques.net — Anticapitalisme"
    url: "https://infokiosques.net/anticapitalisme"
    type: html
    min_interval_days: 14

  - label: "Infokiosques.net — Squat (rapport à l'habiter)"
    url: "https://infokiosques.net/squat"
    type: html
    min_interval_days: 14

  - label: "Infokiosques.net — Anticolonialismes"
    url: "https://infokiosques.net/anticolonialismes"
    type: html
    min_interval_days: 14

  # ═══ Heinrich-Böll-Stiftung (DE/EN, html direct, communs/écologie) ═════════
