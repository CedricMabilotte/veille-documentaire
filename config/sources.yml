  # publications (qui liste les filtres topic) en deep_html pour suivre les
  # liens vers les rapports, et on ajoute la rubrique Atlas (Agriculture
  # Atlas, Meat Atlas) qui contient des PDFs téléchargeables.

  - label: "Böll Stiftung — publications EN (deep crawl)"
    url: "https://www.boell.de/en/publications"
    type: deep_html
    max_pages: 20
    min_interval_days: 14

