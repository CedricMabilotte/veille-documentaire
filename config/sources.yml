# ── Seuil de pertinence ─────────────────────────────────────────────────────
# Un document est téléchargé si son score Claude >= threshold (0 à 10)
threshold: 6

# ── Mots-clés de veille ──────────────────────────────────────────────────────
# Thématique : communs, propriété d'usage, libération des terres,
# paysannerie, communautés rurales, alternatives à la propriété privée.
keywords:
  - communs
  - propriété d'usage
  - fonds de dotation
  - libération des terres
  - accès à la propriété
  - sans-terre
  - paysans libres
  - cosaques
  - collectif d'habitants
  - communauté
  - paysannerie
  - vivrier
  - vivrière
  - propriété privée

# ── Sources à surveiller ─────────────────────────────────────────────────────
# NOTE: les pages de recherche académiques (Persée, HAL, OpenEdition, Cairn…)
# rendent leurs résultats en JavaScript côté client → invisibles pour
# requests+BeautifulSoup. On vise donc des pages dont les liens .pdf
# sont présents en HTML statique.
sources:
  - label: "Infokiosques.net — nouveautés"
    url: "https://infokiosques.net/"

  - label: "Infokiosques.net — brochures (lettre A)"
    url: "https://infokiosques.net/spip.php?rubrique5"

  - label: "Infokiosques.net — brochures (lettre C)"
    url: "https://infokiosques.net/spip.php?rubrique7"

  # Pour scraper Persée/HAL/OpenEdition il faudrait un moteur JS
  # (playwright/selenium) — pas activé par défaut.
