# ── Seuil de pertinence ─────────────────────────────────────────────────────
# Avec le prompt durci, threshold=7 garde un corpus très qualitatif.
# Si tu veux élargir : 6 ; si tu veux ultra-strict : 8.
threshold: 7

# ── Mots-clés de veille (multilingues FR + EN + ES) ──────────────────────────
# Thématique CIBLÉE : propriété d'usage, communs fonciers, libération des
# terres, paysannerie, formes de propriété alternatives.
#
# Mots-clés trop génériques retirés (communauté, community, comunidad,
# propriété privée) — ils matchaient trop de hors-sujet libertaire général.
keywords:
  # Français — concepts pointus
  - propriété d'usage
  - fonds de dotation
  - libération des terres
  - communs fonciers
  - communaux
  - accès à la terre
  - sans-terre
  - paysans libres
  - collectif d'habitants
  - paysannerie
  - agriculture vivrière
  - vivrier
  - réforme agraire
  - souveraineté alimentaire
  - terres collectives
  - propriété collective
  # English — concepts pointus
  - land commons
  - usufruct
  - land rights
  - land liberation
  - landless movement
  - peasantry
  - subsistence farming
  - food sovereignty
  - agrarian reform
  - commoning
  - enclosure
  - collective ownership
  - land back
  # Español — concepts pointus
  - bienes comunes
  - usufructo
  - liberación de la tierra
  - sin tierra
  - campesinado
  - soberanía alimentaria
  - reforma agraria
  - tierra y libertad
  - usos colectivos
  - ejidos
  - tierra comunal

# ── Sources à surveiller ─────────────────────────────────────────────────────
# Champ `type` : html (défaut) | deep_html | opds | archive_org | hal
# Type non spécifié → html (rétrocompat)
sources:
  # ═══ Infokiosques.net — corpus francophone (html direct) ═══════════════════
  # Fonds qui bouge souvent → 7 jours
  - label: "Infokiosques.net — nouveautés"
    url: "https://infokiosques.net/"
    type: html
    min_interval_days: 3

  - label: "Infokiosques.net — index A"
    url: "https://infokiosques.net/spip.php?rubrique5"
    type: html
    min_interval_days: 14

  - label: "Infokiosques.net — index C"
    url: "https://infokiosques.net/spip.php?rubrique7"
    type: html
    min_interval_days: 14

  - label: "Infokiosques.net — index T (Terres, Travail)"
    url: "https://infokiosques.net/spip.php?rubrique11"
    type: html
    min_interval_days: 14

  - label: "Infokiosques.net — index L (Libération, Luttes)"
    url: "https://infokiosques.net/spip.php?rubrique18"
    type: html
    min_interval_days: 14

  # ═══ Heinrich-Böll-Stiftung (DE/EN, html direct, communs/écologie) ═════════
  - label: "Böll Stiftung — publications EN"
    url: "https://www.boell.de/en/publications"
    type: html
    min_interval_days: 14

  - label: "Böll Stiftung — publications DE"
    url: "https://www.boell.de/de/publikationen"
    type: html
    min_interval_days: 14

  # ═══ Crawl 2-niveaux — sites libertaires anglo + FR (deep_html) ════════════
  - label: "libcom.org — library"
    url: "https://libcom.org/library"
    type: deep_html
    max_pages: 20
    min_interval_days: 14

  - label: "CrimethInc — library"
    url: "https://crimethinc.com/library"
    type: deep_html
    max_pages: 20
    min_interval_days: 14

  - label: "CRAS (Centre de Recherches sur les Alternatives Sociales)"
    url: "https://cras31.info/"
    type: deep_html
    max_pages: 15
    min_interval_days: 14

  # ═══ OPDS — The Anarchist Library (multi-langues, gros corpus) ══════════════
  # Archive stable → 30 jours suffit
  - label: "The Anarchist Library — OPDS feed"
    url: "https://theanarchistlibrary.org/opds"
    type: opds
    min_interval_days: 30

  # ═══ API Archive.org — corpus anarchiste / paysanneries (multi-langues) ════
  - label: "Archive.org — Cuba (ES, réforme agraire & coopératives)"
    url: "https://archive.org/advancedsearch.php?q=cuba+AND+language%3A%22spa%22+AND+%28cooperativ*+OR+campesin*+OR+agrari*+OR+%22reforma+agraria%22%29+AND+mediatype%3Atexts&fl%5B%5D=identifier&fl%5B%5D=title&fl%5B%5D=creator&fl%5B%5D=description&output=json&rows=30"
    type: archive_org
    min_interval_days: 30

  - label: "Archive.org — subject:anarchism (texts)"
    url: "https://archive.org/advancedsearch.php?q=subject%3Aanarchism+AND+mediatype%3Atexts&fl%5B%5D=identifier&fl%5B%5D=title&fl%5B%5D=creator&fl%5B%5D=description&output=json&rows=50"
    type: archive_org
    min_interval_days: 14

  - label: "Archive.org — peasant movements"
    url: "https://archive.org/advancedsearch.php?q=subject%3A%22peasant+movement%22+AND+mediatype%3Atexts&fl%5B%5D=identifier&fl%5B%5D=title&fl%5B%5D=creator&fl%5B%5D=description&output=json&rows=50"
    type: archive_org
    min_interval_days: 14

  - label: "Archive.org — commons / enclosure"
