name: Publish → biblio-actitude-org
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
  workflow_dispatch:

concurrency:
  group: publish-biblio-actitude-org
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout veille-documentaire
        uses: actions/checkout@v5
        with:
          lfs: false

      - name: Cache-bust automatique du service worker (CACHE_VERSION = SHA du commit publié)
        run: |
          # L36 (lecons-biblio.md) : un CACHE_VERSION oublié = tous les visiteurs
          # restent bloqués sur l'ancien CSS/JS en cache, indéfiniment. Plutôt que
          # de compter sur un bump manuel à chaque session touchant site/assets/,
          # on dérive la version du SHA du commit qu'on publie : chaque publication
          # invalide donc automatiquement le cache précédent, sans y penser.
          sed -i "s/const CACHE_VERSION = '[^']*';/const CACHE_VERSION = 'biblio-${GITHUB_SHA::8}';/" site/sw.js
          grep CACHE_VERSION site/sw.js

      - name: Publier site/ vers biblio-actitude-org
        env:
          PUBLISH_TOKEN: ${{ secrets.BIBLIO_PUBLISH_TOKEN }}
        run: |
          git clone "https://x-access-token:${PUBLISH_TOKEN}@github.com/CedricMabilotte/biblio-actitude-org.git" /tmp/biblio --depth=1 -q
          rsync -a --delete --exclude='.git' site/ /tmp/biblio/
          cd /tmp/biblio
          git config user.name  "Library Bot"
          git config user.email "bot@library.local"
          git add -A
          git diff --staged --stat
          git diff --staged --quiet && echo "Rien à publier." && exit 0
          git commit -m "publish: $(date '+%Y-%m-%d %H:%M') — sync depuis veille-documentaire@${GITHUB_SHA::7}"
          git push origin main -q
          echo "→ Publié : biblio-actitude-org"
