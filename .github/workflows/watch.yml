name: Veille documentaire

on:
  workflow_dispatch:
    inputs:
      score_threshold:
        description: "Seuil de pertinence (0–10, défaut : 6)"
        default: "6"
        required: false
      dry_run:
        description: "Simulation sans téléchargement (true/false)"
        default: "false"
        required: false
      do_discovery_weekly:
        description: "Lance les discoveries hebdo (OpenAlex, Semantic Scholar, Mastodon, RSS)"
        default: "false"
        required: false
      do_discovery_monthly:
        description: "Lance le diagnostic Claude mensuel (suggestions + angles morts)"
        default: "false"
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installation des dépendances Python
        run: pip install requests beautifulsoup4 pyyaml playwright pymupdf pillow

      - name: Installation de Chromium pour Playwright
        run: python -m playwright install --with-deps chromium

      - name: Installation de Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Lancement de la veille
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SCORE_THRESHOLD:         ${{ github.event.inputs.score_threshold }}
          DRY_RUN:                 ${{ github.event.inputs.dry_run }}
        run: python scripts/watch.py

      - name: Installation de rclone
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version | head -3

      - name: Configuration rclone
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          # base64 du contenu de rclone.conf — évite le mask line-by-line
          # et le conflit avec la variable réservée RCLONE_CONFIG
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          # Affichage sécurisé : sections seulement, valeurs masquées
          grep -E '^\[|^type' ~/.config/rclone/rclone.conf | head -10
          rclone listremotes

      - name: Sync docs/ vers Google Drive
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          rclone copy docs/ gdrive:Veille_documentaire/ \
            --create-empty-src-dirs --stats 30s --stats-one-line
          echo "→ Contenu Drive après sync :"
          rclone size gdrive:Veille_documentaire/

      - name: Sync interface/ + bulles/ vers Google Drive
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          rclone copy interface/ gdrive:Veille_documentaire/interface/ \
            --stats-one-line --stats 30s
          rclone copy bulles/ gdrive:Veille_documentaire/bulles/ \
            --stats-one-line --stats 30s
          echo "→ Interface + bulles dispos sur Drive"

      - name: Exports BibTeX / RIS / CSL JSON
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          mkdir -p exports
          python scripts/export_bibtex.py || echo "  export_bibtex skipped: $?"
          ls -la exports/ 2>/dev/null || true

      - name: Notifications webhooks (Discord/Slack/Mastodon, docs ≥ 9)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          WEBHOOK_DISCORD:   ${{ secrets.WEBHOOK_DISCORD }}
          WEBHOOK_SLACK:     ${{ secrets.WEBHOOK_SLACK }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN:    ${{ secrets.MASTODON_TOKEN }}
        run: 'python scripts/webhooks.py || echo "  webhooks skipped"'

      - name: Review des Issues GitHub (suggestions communautaires)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.BIBLIO_PUBLISH_TOKEN }}
        run: 'python scripts/review_issues.py || echo "  review_issues skipped"'

      - name: Export sources de cet agent (pour cross-pollination future)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: 'python scripts/share_sources.py || echo "  share_sources skipped"'

      - name: "Discovery hebdo (OpenAlex + Semantic Scholar + Mastodon)"
        if: ${{ github.event.inputs.do_discovery_weekly == 'true' }}
        run: |
          python scripts/discovery_openalex.py        || echo "  openalex skipped"
          python scripts/discovery_semantic_scholar.py || echo "  s2 skipped"
          python scripts/discovery_mastodon.py        || echo "  mastodon skipped"

      - name: "Discovery mensuelle (LLM suggest + angles morts)"
        if: ${{ github.event.inputs.do_discovery_monthly == 'true' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          python scripts/discovery_llm_suggest.py || echo "  llm_suggest skipped"
          python scripts/discovery_blind_spots.py || echo "  blind_spots skipped"

      - name: Sync discoveries vers Drive
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -d discovery/ ]; then
            rclone copy discovery/ gdrive:Veille_documentaire/discovery/ --stats-one-line --stats 30s || true
          fi

      - name: Commit reports + catalog + interface + bulles + discoveries
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config --global user.name  "Library Bot"
          git config --global user.email "bot@library.local"
          git add reports/ synopsis/ interface/ bulles/ site/ discovery/ feedback.json exports/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "veille: $(date '+%Y-%m-%d %H:%M') — rapports + catalog + interface + bulles + discoveries"
          git push

      - name: Publier vers biblio.actitude.org (repo public)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          PUBLISH_TOKEN: ${{ secrets.BIBLIO_PUBLISH_TOKEN }}
        run: |
          # Cloner le repo public dédié
          git clone "https://x-access-token:${PUBLISH_TOKEN}@github.com/CedricMabilotte/biblio-actitude-org.git" /tmp/biblio
          # Synchroniser le contenu de site/ (en préservant le .git du repo public)
          rsync -a --delete --exclude='.git' site/ /tmp/biblio/
          cd /tmp/biblio
          git config user.name  "Library Bot"
          git config user.email "bot@library.local"
          git add -A
          git diff --staged --quiet || git commit -m "publish: veille $(date '+%Y-%m-%d %H:%M')"
          git push origin main
          echo "→ Publié sur https://biblio.actitude.org (sous réserve du DNS) ou https://cedricmabilotte.github.io/biblio-actitude-org/"
