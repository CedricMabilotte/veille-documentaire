name: Veille documentaire

on:
  workflow_dispatch:
    inputs:
      score_threshold:
        description: "Seuil de pertinence (0–10, défaut : 6)"
        default: "6"
        required: false
      dry_run:
        description: "Simulation sans téléchargement (true/false)"
        default: "false"
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installation des dépendances
        run: pip install requests beautifulsoup4 anthropic pyyaml

      - name: Lancement de la veille
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCORE_THRESHOLD:   ${{ github.event.inputs.score_threshold }}
          DRY_RUN:           ${{ github.event.inputs.dry_run }}
        run: python scripts/watch.py

      - name: Commit des nouveaux documents
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config --global user.name  "Library Bot"
          git config --global user.email "bot@library.local"
          git add docs/ reports/
          git diff --staged --quiet || git commit -m "veille: $(date '+%Y-%m-%d %H:%M') — nouveaux documents"
          git push
