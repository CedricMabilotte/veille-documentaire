name: Veille documentaire

on:
  schedule:
    # Veille quotidienne automatique, 03:00 UTC (creux de trafic). Avant ce
    # cron, "watch.yml" n'avait qu'un déclenchement manuel (workflow_dispatch)
    # — la "veille automatisée" ne l'était donc pas vraiment en pratique.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      score_threshold:
        description: "Seuil de pertinence (0–10, défaut : 6)"
        default: "6"
        required: false
      dry_run:
        description: "Simulation sans téléchargement (true/false)"
        default: "false"
        required: false
      do_discovery_weekly:
        description: "Lance les discoveries hebdo (OpenAlex, Semantic Scholar, Mastodon, RSS)"
        default: "false"
        required: false
      do_discovery_monthly:
        description: "Lance le diagnostic Claude mensuel (suggestions + angles morts)"
        default: "false"
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  watch:
    runs-on: ubuntu-latest
    # 2026-08-26 : incident ou le job est reste bloque 6h (limite max du
    # runner) sur l'etape "Lancement de la veille" -- Claude Code CLI avait
    # atteint sa limite de session et le script retentait chaque document en
    # boucle sans jamais s'arreter (cf. scripts/claude_guard.py, ajoute dans
    # le meme commit que ce timeout). Ce timeout-minutes est un filet de
    # securite independant : meme un futur blocage d'une autre nature echoue
    # en 1h plutot qu'en 6h.
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v5

      - name: Résolution des paramètres de run (cron vs déclenchement manuel)
        run: |
          # Un run planifié ("schedule") n'a pas d'objet "inputs" — les steps
          # suivants lisaient directement github.event.inputs.*, ce qui aurait
          # fait planter "Lancement de la veille" (SCORE_THRESHOLD="" → int("")
          # lève une exception dans watch.py) sur tout run cron. On calcule ici
          # des valeurs par défaut sûres pour un run planifié, en conservant le
          # comportement existant pour un déclenchement manuel.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "SCORE_THRESHOLD=6"      >> "$GITHUB_ENV"
            echo "DRY_RUN=false"          >> "$GITHUB_ENV"
            DOW=$(date -u +%u)   # 1 = lundi
            DOM=$(date -u +%d)
            if [ "$DOW" = "1" ]; then echo "DO_DISCOVERY_WEEKLY=true" >> "$GITHUB_ENV"; else echo "DO_DISCOVERY_WEEKLY=false" >> "$GITHUB_ENV"; fi
            if [ "$DOM" = "01" ]; then echo "DO_DISCOVERY_MONTHLY=true" >> "$GITHUB_ENV"; else echo "DO_DISCOVERY_MONTHLY=false" >> "$GITHUB_ENV"; fi
          else
            echo "SCORE_THRESHOLD=${{ github.event.inputs.score_threshold }}"   >> "$GITHUB_ENV"
            echo "DRY_RUN=${{ github.event.inputs.dry_run }}"                   >> "$GITHUB_ENV"
            echo "DO_DISCOVERY_WEEKLY=${{ github.event.inputs.do_discovery_weekly }}"   >> "$GITHUB_ENV"
            echo "DO_DISCOVERY_MONTHLY=${{ github.event.inputs.do_discovery_monthly }}" >> "$GITHUB_ENV"
          fi

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Installation des dépendances Python
        run: pip install requests beautifulsoup4 pyyaml playwright pymupdf pillow

      - name: Installation de Chromium pour Playwright
        run: python -m playwright install --with-deps chromium

      - name: Installation de Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Lancement de la veille
        # 2026-09-15 : du 30/08 au 15/09, chaque run a ete tue au timeout de
        # job (180 min) pendant cette etape, avant le commit -> 17 jours de
        # travail perdus. watch.py s'arrete desormais de lui-meme quand la
        # boucle de collecte depasse WATCH_BUDGET_MIN (sources restantes
        # reportees au run suivant) ; ce timeout d'etape n'est qu'un filet.
        timeout-minutes: 150
        env:
          WATCH_BUDGET_MIN:        "75"
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SCORE_THRESHOLD:         ${{ env.SCORE_THRESHOLD }}
          DRY_RUN:                 ${{ env.DRY_RUN }}
        run: python scripts/watch.py

      - name: Installation de rclone
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version | head -3

      - name: Configuration rclone
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          # base64 du contenu de rclone.conf — évite le mask line-by-line
          # et le conflit avec la variable réservée RCLONE_CONFIG
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          # Affichage sécurisé : sections seulement, valeurs masquées
          grep -E '^\[|^type' ~/.config/rclone/rclone.conf | head -10
          rclone listremotes

      - name: Sync docs/ vers Google Drive
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          rclone copy docs/ gdrive:Veille_documentaire/ \
            --create-empty-src-dirs --stats 30s --stats-one-line
          echo "→ Contenu Drive après sync :"
          rclone size gdrive:Veille_documentaire/

      - name: Sync interface/ + bulles/ vers Google Drive
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          rclone copy interface/ gdrive:Veille_documentaire/interface/ \
            --stats-one-line --stats 30s
          rclone copy bulles/ gdrive:Veille_documentaire/bulles/ \
            --stats-one-line --stats 30s
          echo "→ Interface + bulles dispos sur Drive"

      - name: Exports BibTeX / RIS / CSL JSON
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          mkdir -p exports
          python scripts/export_bibtex.py || echo "  export_bibtex skipped: $?"
          ls -la exports/ 2>/dev/null || true

      - name: Notifications webhooks (Discord/Slack/Mastodon, docs ≥ 9)
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          WEBHOOK_DISCORD:   ${{ secrets.WEBHOOK_DISCORD }}
          WEBHOOK_SLACK:     ${{ secrets.WEBHOOK_SLACK }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN:    ${{ secrets.MASTODON_TOKEN }}
        run: 'python scripts/webhooks.py || echo "  webhooks skipped"'

      - name: Review des Issues GitHub (suggestions communautaires)
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.BIBLIO_PUBLISH_TOKEN }}
        run: 'python scripts/review_issues.py || echo "  review_issues skipped"'

      - name: Export sources de cet agent (pour cross-pollination future)
        if: ${{ env.DRY_RUN != 'true' }}
        run: 'python scripts/share_sources.py || echo "  share_sources skipped"'

      - name: "Discovery hebdo (OpenAlex + Semantic Scholar + Mastodon)"
        if: ${{ env.DO_DISCOVERY_WEEKLY == 'true' }}
        run: |
          python scripts/discovery_openalex.py        || echo "  openalex skipped"
          python scripts/discovery_semantic_scholar.py || echo "  s2 skipped"
          python scripts/discovery_mastodon.py        || echo "  mastodon skipped"

      - name: "Discovery mensuelle (LLM suggest + angles morts)"
        if: ${{ env.DO_DISCOVERY_MONTHLY == 'true' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          python scripts/discovery_llm_suggest.py || echo "  llm_suggest skipped"
          python scripts/discovery_blind_spots.py || echo "  blind_spots skipped"

      - name: Sync discoveries vers Drive
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          if [ -d discovery/ ]; then
            rclone copy discovery/ gdrive:Veille_documentaire/discovery/ --stats-one-line --stats 30s || true
          fi

      - name: Commit reports + catalog + interface + bulles + discoveries
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          git config --global user.name  "Library Bot"
          git config --global user.email "bot@library.local"
          git add reports/ synopsis/ interface/ bulles/ site/ discovery/ feedback.json exports/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "veille: $(date '+%Y-%m-%d %H:%M') — rapports + catalog + interface + bulles + discoveries"
          git push
          # La publication vers biblio-actitude-org n'est plus faite ici : ce push,
          # s'il touche site/, déclenche automatiquement publish-only.yml (trigger
          # on: push, paths: site/**). Une seule logique de publication, à un seul
          # endroit, plutôt que dupliquée dans les deux workflows.
