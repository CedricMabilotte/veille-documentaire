# SOURCES REGISTRY — base centralisée de toutes les sources testées
#
# Chaque entrée trace : statut, type de parser nécessaire, historique de probes.
# Ce fichier est mis à jour automatiquement par scripts/probe_source.py et
# scripts/source_health.py, et lu par les humains et agents pour décider
# quelles sources ajouter à config/sources.yml.
#
# Statuts possibles :
#   - active      : utilisée dans config/sources.yml, en production
#   - validated   : testée, exploitable, pas encore en production
#   - needs_parser: testée, exploitable mais nécessite un parser spécialisé
#   - js_only     : nécessite Playwright/Selenium
#   - dead        : URL morte ou contenu inexistant
#   - rejected    : volontairement écartée (paywall, hors thématique, etc.)
#
# Types de parser :
#   - html        : scraper requests+BS4 standard (find_documents)
#   - deep_html   : crawl 2-niveaux (suit les liens d'articles)
#   - opds        : feed XML OPDS
#   - archive_org : API JSON de archive.org/advancedsearch.php
#   - hal         : API JSON de api.archives-ouvertes.fr
#   - playwright  : JS rendering nécessaire (non implémenté)

