resume: >
  Association loi 1901 présente sur le domaine de la Bergerie de Villarceaux, dont
  le foncier appartient à la Fondation Charles Léopold Mayer. Plusieurs structures
  juridiques distinctes cohabitent sur le site : l'exploitation agricole sous
  forme d'EARL, l'association Écosite et la coopérative Coop'Saveur, créée en
  2001. L'association porte des activités d'animation et de formation liées à la
  transition agroécologique du domaine.
montage:
  type: propriete_sanctuarisee
  nu_proprietaire: "Fondation Charles Léopold Mayer pour le Progrès de l'Homme (FPH)"
  usufruitier: "Titulaire de l'usage : association Écosite (animation, formation) et EARL Olivier Ranke (exploitation agricole) ; nature exacte des titres d'usage non documentée"
  description: >
    L'association Écosite est l'une des structures d'usage du domaine de
    Villarceaux, propriété de la FPH. Elle porte l'animation et la formation,
    tandis que l'exploitation agricole relève d'une EARL. La nature exacte des
    actes liant l'association à la fondation n'est pas documentée par les sources.
