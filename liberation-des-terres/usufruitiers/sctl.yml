uid: sctl
categorie: usufruitier
nom: "Société Civile des Terres du Larzac"
sous_titre: "Office foncier local gérant les terres publiques du Larzac"
statut_fiche: publie
forme_juridique: "Société civile"
localisation: null
annee: 1985
url: "https://larzac.org/accueil/un-territoire-organise/gestion-fonciere/sctl/"
resume: >
  Société civile constituée le 29 avril 1985, après une recherche de structure
  engagée dès décembre 1982, la SCTL se voit confier la gestion de l'ensemble
  bâti et non bâti des terres du Larzac, propriété de l'État. Elle détient ce
  foncier par un bail emphytéotique de 99 ans conclu avec l'État (échéance 2083)
  et attribue l'usage aux paysan·nes via des baux de long terme. Ses associés sont
  les personnes physiques et morales utilisant les terres ou bâtiments confiés à
  la société : elle fonctionne comme un office foncier local.
montage:
  type: propriete_publique
  nu_proprietaire: "État (propriété publique des terres du Larzac)"
  usufruitier: "Titulaire de l'usage : Société Civile des Terres du Larzac (SCTL), preneuse d'un bail emphytéotique de 99 ans consenti par l'État"
  description: >
    La SCTL n'est pas propriétaire : elle détient le foncier de l'État par un
    bail emphytéotique, d'abord de 60 ans puis porté à 99 ans (maximum légal),
    sécurisant les 6 300 hectares jusqu'en 2083. Elle redistribue l'usage aux
    paysan·nes par des baux de long terme. Ses associés sont les utilisateurs
    eux-mêmes, ce qui en fait une structure d'usage collective.
purete_juridique:
  niveau: encadre
  commentaire: >
    Société civile de droit privé articulée à une propriété publique ; structure
    d'usage collective dont les associés sont les utilisateurs du foncier.
