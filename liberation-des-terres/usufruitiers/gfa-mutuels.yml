uid: gfa-mutuels
categorie: usufruitier
nom: "Groupements fonciers agricoles mutuels et solidaires"
sous_titre: "Sociétés civiles agricoles de propriété foncière collective"
statut_fiche: publie
forme_juridique: "Société civile (groupement foncier agricole)"
localisation: null
annee: null
url: "https://ressources.terredeliens.org/les-ressources/decouvrir-les-gfa-sci-citoyens"
resume: >
  Les groupements fonciers agricoles (GFA) sont des sociétés civiles spécifiques à
  l'agriculture, créées dans les années 1970. On distingue le GFA d'exploitation
  et le GFA bailleur, qui loue ses terres par bail rural. Les GFA mutuels et
  solidaires, composés uniquement de personnes physiques, organisent une propriété
  foncière collective et mobilisent l'épargne citoyenne. Terre de Liens indique
  avoir accompagné 45 GFA et structures similaires.
montage:
  type: propriete_collective
  nu_proprietaire: "Groupement foncier agricole (société civile)"
  usufruitier: "Titulaire de l'usage : fermier preneur d'un bail rural (pour le GFA bailleur), bail dont le renouvellement est d'ordre public"
  description: >
    Le GFA mutuel ou solidaire détient collectivement un foncier agricole et,
    lorsqu'il est bailleur, le loue à un fermier par bail rural. Terre de Liens
    distingue ce GFA mutuel ou solidaire du GFA d'épargnants, qu'elle qualifie
    d'outil financier contre-productif pour le renouvellement des générations.
purete_juridique:
  niveau: civil_encadre
  commentaire: >
    Société civile agricole ; la pureté dépend des clauses statutaires, le GFA
    mutuel ou solidaire se distinguant nettement du GFA d'épargnants spéculatif.
grille:
  - critere: personne_morale_civile
    valeur: oui
    note: "Le GFA est une société civile, personne morale de droit civil spécifique à l'agriculture."
  - critere: objet_ig
    valeur: partiel
    note: "Le GFA mutuel ou solidaire sert l'accès à la terre, mais l'objet d'intérêt général dépend des clauses statutaires."
  - critere: non_lucrativite_effective
    valeur: partiel
    note: "Le GFA mutuel se distingue du GFA d'épargnants spéculatif, mais la non-lucrativité dépend du verrouillage statutaire."
  - critere: public_non_restreint
    valeur: partiel
    note: "Le GFA mutuel mobilise l'épargne citoyenne au-delà du fermier, mais peut associer un cercle limité de personnes physiques."
  - critere: duree_usage
    valeur: oui
    note: "Le GFA bailleur loue ses terres par bail rural : durée minimale de 9 ans, mais assortie d'un droit au renouvellement d'ordre public qui sécurise le preneur dans la durée."
  - critere: clauses_usage
    valeur: inconnu
    note: "L'inscription systématique de clauses environnementales dans les baux des GFA n'est pas documentée par les sources."
  - critere: articulation_porteur
    valeur: partiel
    note: "Le GFA peut être lui-même porteur et bailleur ; l'articulation avec un tiers porteur dépend du montage."
  - critere: non_appropriation
    valeur: partiel
    note: "Le foncier est détenu collectivement, mais les parts du GFA restent cessibles, ce qui ouvre une appropriation possible de la valeur."
  - critere: parts_non_cessibles
    valeur: non
    note: "Les parts du GFA, société civile, restent par défaut cessibles ; le GFA mutuel ou solidaire peut les encadrer statutairement, mais aucun verrouillage systématique n'est documenté : la valeur foncière reste captable."
  - critere: une_voix
    valeur: inconnu
    note: "Les modalités de vote dans les GFA mutuels ne sont pas détaillées par les sources."
  - critere: usagers_decident
    valeur: partiel
    note: "Le GFA mutuel associe des personnes physiques, mais la place décisionnelle du fermier preneur n'est pas documentée."
  - critere: ouverture_entrants
    valeur: partiel
    note: "Le GFA mutuel vise le renouvellement des générations, à la différence du GFA d'épargnants, mais les modalités d'accueil ne sont pas détaillées."
  - critere: transparence_interne
    valeur: inconnu
    note: "Les modalités de transparence interne des GFA ne sont pas documentées par les sources."
  - critere: devolution_usufruitier
    valeur: inconnu
    note: "Le sort de l'actif du GFA en cas de dissolution dépend des statuts ; il n'est pas documenté par les sources consultées."
analyse:
  forces:
    - "Société civile agricole permettant une propriété foncière collective."
    - "Le GFA mutuel ou solidaire mobilise l'épargne citoyenne hors logique spéculative."
    - "Outil accompagné par Terre de Liens, distingué du GFA d'épargnants."
  fragilites:
    - "Parts cessibles : appropriation possible de la valeur foncière."
    - "Pureté dépendante du verrouillage statutaire, variable d'un GFA à l'autre."
    - "Gouvernance et transparence interne non documentées."
  leviers:
    - "Verrouiller statutairement la non-lucrativité et l'anti-spéculation."
    - "Inscrire des clauses environnementales dans les baux ruraux."
    - "Documenter la gouvernance et l'accueil de nouveaux entrants."
  synthese: >
    Le GFA mutuel ou solidaire est un outil de propriété foncière collective
    distinct du GFA d'épargnants spéculatif. Sa solidité dépend entièrement du
    verrouillage statutaire, les parts restant par défaut cessibles.
fiabilite: >
  Faits vérifiés : GFA, société civile agricole créée dans les années 1970,
  distinction entre GFA d'exploitation et GFA bailleur, GFA mutuels composés de
  personnes physiques, accompagnement de 45 GFA et structures similaires par
  Terre de Liens, distinction d'avec le GFA d'épargnants. Non confirmé : modalités
  de vote, clauses environnementales, transparence interne.
liens:
