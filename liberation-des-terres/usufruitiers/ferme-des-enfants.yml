uid: ferme-des-enfants
categorie: usufruitier
nom: "Association La Ferme des Enfants"
sous_titre: "Association d'intérêt général portant le projet du Hameau des Buis"
statut_fiche: publie
forme_juridique: "Association loi 1901"
localisation: null
annee: null
url: "https://hameaudesbuis.org/"
resume: >
  Association loi 1901 portant le projet pédagogique et de ferme-école du Hameau
  des Buis, en sud Ardèche. Elle est associée, avec une SARL de soutien aux
  projets éthiques, à la société civile qui détient le foncier, et y détient le
  pouvoir de décision final — gage de cohérence avec l'intérêt général. Le Hameau
  est aujourd'hui organisé en SAS coopérative à gouvernance partagée. Les
  habitant·es du lieu ne sont pas associés mais créanciers de la société civile.
montage:
  type: propriete_collective
  nu_proprietaire: "Société civile « Le Hameau des Buis » (constituée en 2003)"
  usufruitier: "Titulaire de l'usage : association La Ferme des Enfants, exerçant le pouvoir de décision final en qualité d'associée de la société civile"
  description: >
    L'association La Ferme des Enfants est associée à la société civile détenant
    le foncier et y exerce le pouvoir de décision final. Elle porte l'usage,
    l'animation et la vocation pédagogique du lieu. Le Hameau a évolué vers une
    SAS coopérative à gouvernance partagée, qui constitue son organisation
    actuelle.
purete_juridique:
  niveau: societaire
  commentaire: >
    Association loi 1901 d'intérêt général exerçant la décision finale, mais
    montage comportant une SARL associée à la société civile porteuse et une
    organisation en SAS coopérative : la dimension sociétaire est constitutive du
    montage.
grille:
  - critere: personne_morale_civile
    valeur: oui
    note: "La Ferme des Enfants est une association loi 1901, personne morale de droit civil non lucrative."
  - critere: objet_ig
    valeur: oui
    note: "L'objet porte sur la pédagogie, la ferme-école et l'habitat intergénérationnel, un intérêt général éducatif et social."
  - critere: non_lucrativite_effective
    valeur: oui
    note: "L'association loi 1901 ne partage pas de bénéfices ; elle exerce la décision finale dans la société civile."
  - critere: public_non_restreint
    valeur: oui
    note: "La vocation pédagogique et de ferme-école dépasse les seuls habitant·es du lieu."
  - critere: duree_usage
    valeur: partiel
    note: "Le pouvoir de décision finale dans la société civile assure une maîtrise durable, mais aucun titre d'usage formalisé (bail, convention) ni sa durée ne sont documentés."
  - critere: clauses_usage
    valeur: inconnu
    note: "L'existence de clauses d'usage formalisées entre association et société civile n'est pas documentée par les sources."
  - critere: articulation_porteur
    valeur: oui
    note: "L'association est elle-même associée à la société civile portant le foncier et y détient la décision finale."
  - critere: non_appropriation
    valeur: partiel
    note: "Les habitant·es sont créanciers via prêt en viager et non propriétaires, mais une SARL associée à la société civile peut détenir une valeur."
  - critere: une_voix
    valeur: partiel
    note: "L'association fonctionne sur le principe associatif, mais le poids respectif de l'association et de la SARL dans la société civile n'est pas détaillé."
  - critere: usagers_decident
    valeur: partiel
    note: "L'association porte la décision finale, mais les habitant·es, créanciers et non associés, ont une place décisionnelle limitée."
  - critere: ouverture_entrants
    valeur: partiel
    note: "Le viager organise une forme de renouvellement des logements et le Hameau a évolué vers une SAS coopérative à gouvernance partagée, mais les modalités d'accueil de nouveaux entrants ne sont pas toutes documentées."
  - critere: transparence_interne
    valeur: inconnu
    note: "Les modalités de transparence interne de l'association ne sont pas documentées par les sources."
  - critere: devolution_usufruitier
    valeur: inconnu
    note: "Le sort de l'actif de l'association en cas de dissolution n'est pas documenté par les sources consultées."
analyse:
  forces:
    - "Pouvoir de décision final confié à une association d'intérêt général."
    - "Vocation pédagogique et intergénérationnelle clairement affirmée."
    - "Montage de droit civil non lucratif pour la structure décisionnelle."
  fragilites:
    - "Habitant·es créanciers et non associés : place décisionnelle limitée."
    - "Présence d'une SARL dans la société civile portant le foncier."
    - "Clauses d'usage et transparence interne non documentées."
  leviers:
    - "Formaliser des clauses d'usage entre association et société civile."
    - "Consolider la place décisionnelle des habitant·es dans la SAS coopérative."
