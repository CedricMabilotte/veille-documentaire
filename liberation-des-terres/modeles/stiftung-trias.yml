uid: stiftung-trias
categorie: modele
nom: "Stiftung trias"
sous_titre: "Fondation allemande sanctuarisant le foncier par droit de superficie"
statut_fiche: publie
forme_juridique: "Fondation à but non lucratif (Stiftung)"
pays: "Allemagne"
annee: 2002
url: "https://www.stiftung-trias.de/english/"
resume: >
  Fondation à but non lucratif établie à Hattingen le 2 mars 2002. Stiftung trias
  acquiert des terrains et les affecte durablement à un usage socio-écologique via
  le droit de superficie héréditaire (Erbbaurecht), qui dissocie le sol du bâti.
  Selon les sources, elle aurait soustrait environ un million de mètres carrés au
  marché spéculatif. C'est le modèle voisin le plus proche conceptuellement du
  modèle de référence.
montage:
  type: propriete_sanctuarisee
  description: >
    La fondation acquiert le sol et le conserve durablement, accordant aux projets
    un droit de superficie héréditaire de longue durée portant sur le bâti. La
    séparation sol/bâti par une fondation non lucrative et un droit réel long
    sanctuarise le foncier.
purete_juridique:
  niveau: civil_non_lucratif
  commentaire: >
    Fondation non lucrative recourant à un droit réel long : montage de droit
    civil, structurellement très proche du modèle de référence.
axes_estimes:
  A: 90
  B: 90
  C: 70
analyse:
  forces:
    - "Fondation non lucrative sanctuarisant durablement le sol."
    - "Droit de superficie héréditaire dissociant sol et bâti."
    - "Environ un million de mètres carrés soustraits au marché spéculatif."
  fragilites:
    - "Cadre juridique allemand (Erbbaurecht), non directement transposable."
    - "Gouvernance participative variable selon les projets."
    - "Le pourcentage et la surface annoncés peuvent évoluer."
  leviers:
    - "S'inspirer de la séparation sol/bâti par fondation et droit réel long."
    - "Renforcer la dimension participative des projets accueillis."
    - "Capitaliser l'expérience comme référence européenne."
  synthese: >
    Stiftung trias est le modèle voisin le plus proche conceptuellement du modèle
    de référence : fondation non lucrative et droit réel long. Sa transposition en
    France suppose d'adapter le mécanisme du droit de superficie.
fiabilite: >
  Faits vérifiés : fondation à but non lucratif établie à Hattingen le 2 mars
  2002, recours au droit de superficie héréditaire, finalité socio-écologique.
  Non confirmé avec précision : la surface d'environ un million de mètres carrés,
  issue de sources de presse, peut évoluer.
