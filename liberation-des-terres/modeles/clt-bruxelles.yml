uid: clt-bruxelles
categorie: modele
nom: "Community Land Trust de Bruxelles"
sous_titre: "Premier CLT d'Europe continentale, à gouvernance tripartite"
statut_fiche: publie
forme_juridique: "Fondation d'utilité publique (foncier) et ASBL (gestion)"
pays: "Belgique"
annee: 2012
url: "https://www.citego.org/bdf_fiche-document-871_fr.html"
resume: >
  Constitué le 20 décembre 2012, le Community Land Trust de Bruxelles est le
  premier CLT d'Europe continentale. Il s'inspire du Community Land Trust
  anglo-saxon, né aux États-Unis au début des années 1970. Le foncier est porté
  par une fondation d'utilité publique, la gestion par une ASBL. Sa gouvernance
  tripartite répartit statutairement les sièges du conseil d'administration en
  trois tiers égaux entre les habitant·es, les représentant·es du voisinage et
  de la société civile, et les pouvoirs publics.
montage:
  type: propriete_collective
  description: >
    Une fondation d'utilité publique détient le foncier, une ASBL en assure la
    gestion. La gouvernance tripartite associe à parts égales habitant·es,
    voisinage et société civile, et pouvoirs publics. Cette répartition des
    sièges en trois tiers égaux est la règle statutaire du conseil
    d'administration, sous réserve d'évolutions possibles dans le temps.
purete_juridique:
  niveau: civil_encadre
  commentaire: >
    Montage mixte fondation et association, non lucratif, mais soumis à une
    influence publique notable au travers de la gouvernance tripartite.
axes_estimes:
  A: 90
  B: 90
  C: 90
analyse:
  forces:
    - "Gouvernance tripartite associant habitant·es, voisinage et pouvoirs publics."
    - "Foncier porté par une fondation d'utilité publique."
    - "Modèle pionnier en Europe continentale, finalité claire de sortie du marché."
  fragilites:
    - "Montage mixte fondation et association, avec influence publique notable."
    - "Répartition statutaire des sièges en trois tiers, sous réserve d'évolutions futures."
    - "Cadre belge, non directement transposable en droit français."
  leviers:
    - "S'inspirer de la gouvernance tripartite pour les montages français."
    - "Articuler fondation porteuse et association gestionnaire."
    - "Formaliser la représentation du voisinage et de la société civile."
  synthese: >
    Le CLT de Bruxelles est très proche du modèle de référence et constitue la
    meilleure illustration d'une gouvernance tripartite aboutie. Son cadre belge
    le distingue du droit civil français.
fiabilite: >
  Faits vérifiés : constitution le 20 décembre 2012, premier CLT d'Europe
  continentale, inspiration du Community Land Trust anglo-saxon des années 1970,
  foncier porté par une fondation d'utilité publique, gestion par une ASBL,
  répartition statutaire du conseil d'administration en trois tiers égaux
  (habitant·es / voisinage et société civile / pouvoirs publics). Non confirmé :
  évolutions futures éventuelles de cette répartition.
