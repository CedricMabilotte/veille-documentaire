uid: mietshauser-syndikat
categorie: modele
nom: "Mietshäuser Syndikat"
sous_titre: "Neutralisation de la propriété par droit de veto sur la revente"
statut_fiche: publie
forme_juridique: "Réseau de sociétés (GmbH) à capital partagé"
pays: "Allemagne"
annee: 1992
url: "https://www.syndikat.org/en/faq-englisch/"
resume: >
  Formalisé à Fribourg en 1992, le Mietshäuser Syndikat organise une
  « neutralisation de la propriété ». Chaque immeuble est porté par une société à
  responsabilité limitée (GmbH) dont le capital est partagé entre les habitant·es et
  le Syndikat central. Ce dernier dispose d'un droit de veto sur toute revente,
  verrou destiné à empêcher la re-marchandisation du logement. La gouvernance
  repose sur l'autogestion des habitant·es.
montage:
  type: propriete_collective
  description: >
    Chaque immeuble est détenu par une GmbH dédiée, dont le capital est partagé
    entre le collectif d'habitant·es et le Syndikat central. Le Syndikat dispose
    d'un droit de veto sur toute revente : aucun immeuble ne peut être remis sur
    le marché sans son accord. Les habitant·es s'autogèrent.
purete_juridique:
  niveau: societaire
  commentaire: >
    Montage reposant sur des sociétés GmbH, forme sociétaire ; la non-lucrativité
    et l'irréversibilité sont assurées par le droit de veto du Syndikat.
axes_estimes:
  A: 70
  B: 90
  C: 90
analyse:
  forces:
    - "Droit de veto du Syndikat sur toute revente : irréversibilité forte."
    - "Autogestion des habitant·es : gouvernance réellement participative."
    - "Réseau éprouvé depuis 1992, neutralisation de la propriété."
  fragilites:
    - "Montage reposant sur des sociétés GmbH, forme sociétaire."
