    - "Mobiliser le partage de capital entre habitant·es et structure faîtière."
    - "Adapter le mécanisme au droit civil français."
  synthese: >
    Le Mietshäuser Syndikat illustre une irréversibilité forte par droit de veto
    et une autogestion aboutie. Sa forme sociétaire (GmbH) le situe légèrement en
    retrait du modèle de référence sur la pureté juridique.
fiabilite: >
  Faits vérifiés : réseau formalisé à Fribourg en 1992, chaque immeuble porté par
  une GmbH à capital partagé entre habitant·es et Syndikat central, droit de veto du
