uid: ofs-brs
categorie: modele
nom: "Organisme de Foncier Solidaire + Bail Réel Solidaire"
sous_titre: "Dissociation foncier/bâti pour le logement abordable"
statut_fiche: publie
forme_juridique: "Organisme sans but lucratif agréé par le préfet de région (OFS)"
pays: "France"
annee: 2014
url: "https://www.foncier-solidaire.fr/le-reseau/les-principes-du-foncier-solidaire/"
resume: >
  Les Organismes de Foncier Solidaire ont été créés par la loi ALUR du 24 mars
  2014 ; le Bail Réel Solidaire est issu d'une ordonnance du 20 juillet 2016.
  L'OFS, organisme sans but lucratif agréé par le préfet de région, reste
  propriétaire du sol et consent un BRS portant sur le seul bâti. La dissociation
  réduit le coût d'acquisition de 20 à 40 %. Conclu pour 18 à 99 ans, le BRS est
  rechargé à sa durée initiale à chaque mutation, ce qui le rend potentiellement
  perpétuel ; le prix de revente est encadré.
montage:
  type: propriete_sanctuarisee
  description: >
    L'OFS conserve la pleine propriété du sol sur le long terme et consent au
    ménage un BRS portant uniquement sur le bâti. Le rechargement du bail à chaque
    mutation et l'encadrement du prix de revente neutralisent la spéculation. Le
    dispositif relève d'une logique de politique publique du logement, fortement
    encadrée par l'État.
purete_juridique:
  niveau: civil_encadre
  commentaire: >
    Montage non lucratif mais fortement encadré par l'État (agrément préfectoral,
    plafonds de ressources) ; l'OFS porte la pleine propriété du sol et non une
    simple nue-propriété.
axes_estimes:
  A: 90
  B: 90
  C: 50
analyse:
  forces:
    - "Bail rechargé à chaque mutation : sortie du marché potentiellement perpétuelle."
    - "Prix de revente encadré, neutralisant la spéculation."
    - "Agrément public et logement abordable ancrant l'intérêt général."
  fragilites:
    - "Encadrement étatique fort : logique de politique publique plus que de droit civil."
    - "Gouvernance participative seulement si l'OFS la prévoit statutairement."
    - "L'OFS porte la pleine propriété du sol, non une nue-propriété démembrée."
  leviers:
    - "Inscrire statutairement une gouvernance participative dans l'OFS."
    - "Mobiliser le BRS comme brique pour des projets agricoles ou collectifs."
    - "Articuler l'OFS avec des associations d'usager·es."
  synthese: >
    L'OFS/BRS est très proche du modèle de référence par sa finalité de sortie du
    marché et sa durée quasi perpétuelle. Il s'en distingue par un encadrement
    étatique fort et une gouvernance participative seulement optionnelle.
fiabilite: >
  Faits vérifiés : création des OFS par la loi ALUR du 24 mars 2014, BRS issu de
  l'ordonnance du 20 juillet 2016, durée de 18 à 99 ans, rechargement à chaque
  mutation, économie de 20 à 40 %, encadrement du prix de revente. Les axes
  estimés sont une conversion indicative du tableau comparatif du rapport de
  recherche.
sources:
  - titre: "Foncier Solidaire France — Les principes du foncier solidaire"
    url: "https://www.foncier-solidaire.fr/le-reseau/les-principes-du-foncier-solidaire/"
  - titre: "Aménagement durable — Le bail réel solidaire"
    url: "https://amenagement-durable.ecologie.gouv.fr/bail-reel-solidaire"
