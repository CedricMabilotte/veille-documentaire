uid: fonciere-chenelet
categorie: porteur
nom: "Foncière Chênelet"
sous_titre: "Foncière solidaire de logement social écologique"
statut_fiche: publie
forme_juridique: "Foncière solidaire (entreprise solidaire d'utilité sociale, ESUS)"
localisation: null
annee: 2009
url: "https://fonciere-chenelet.org/"
resume: >
  Foncière solidaire fondée en 2009 par François Marty, dans la mouvance du
  groupe d'insertion Chênelet. Elle monte et conserve la propriété de logements
  sociaux écologiques, qu'elle loue à des ménages à très faibles revenus avec
  des charges fortement réduites. Reconnue entreprise solidaire d'utilité
  sociale (ESUS) et agréée maîtrise d'ouvrage d'insertion dans plusieurs
  régions, elle construit en matériaux sains et basse consommation, avec des
  clauses d'insertion obligatoires dans ses marchés de construction.
montage:
  type: propriete_sanctuarisee
  description: >
    La Foncière Chênelet acquiert ou fait construire des logements sociaux
    écologiques, en conserve la propriété et les loue durablement à des ménages
    à très faibles revenus. Le foncier et le bâti ne sont pas destinés à la
    revente : la foncière joue le rôle de bailleur social pérenne. La
    construction en matériaux sains permet des charges résidentielles
    nettement réduites par rapport au logement social conventionnel.
purete_juridique:
  niveau: societaire_solidaire
  commentaire: >
    Foncière de forme sociétaire à finalité solidaire, agréée ESUS ; la
    non-lucrativité repose sur l'agrément et les clauses encadrant le capital.
grille:
  - critere: forme_non_lucrative
    valeur: partiel
    note: "La Foncière Chênelet est une foncière solidaire de forme sociétaire ; sa vocation non lucrative repose sur l'agrément ESUS et ses clauses statutaires."
  - critere: non_lucrativite_effective
    valeur: partiel
    note: "L'agrément ESUS encadre la lucrativité et plafonne la rémunération du capital, mais une rémunération limitée des apporteurs n'est pas exclue par construction."
  - critere: agrement_ig
    valeur: oui
    note: "La foncière est reconnue entreprise solidaire d'utilité sociale (ESUS) et agréée maîtrise d'ouvrage d'insertion dans plusieurs régions."
  - critere: objet_foncier_protecteur
    valeur: oui
    note: "L'objet est explicitement de porter durablement des logements sociaux écologiques pour des ménages à très faibles revenus."
  - critere: gestion_desinteressee
    valeur: oui
    note: "L'agrément ESUS impose un encadrement strict des écarts de rémunération et une finalité sociale prioritaire."
  - critere: inalienabilite
    valeur: partiel
    note: "La foncière conserve durablement la propriété du parc, mais aucune clause d'inaliénabilité statutaire stricte n'est documentée."
  - critere: parts_non_cessibles
    valeur: partiel
    note: "La foncière repose sur un capital solidaire encadré par l'agrément ESUS, mais le plafonnement du prix de cession des titres n'est pas documenté."
  - critere: nature_protectrice
    valeur: partiel
    note: "Une foncière de forme sociétaire se situe sous la fondation et la personne publique sur l'échelle de protection."
  - critere: clause_devolution
    valeur: inconnu
    note: "Le sort de l'actif de la foncière en cas de dissolution n'est pas documenté par les sources consultées."
  - critere: independance_rendement
    valeur: partiel
    note: "L'agrément ESUS limite la rémunération du capital, mais la foncière mobilise des investisseurs solidaires dont l'apport n'est pas strictement gratuit."
  - critere: ca_collegial
    valeur: inconnu
    note: "La composition des instances de direction de la foncière n'est pas documentée par les sources consultées."
  - critere: parties_prenantes
    valeur: partiel
    note: "La foncière s'inscrit dans le groupe d'insertion Chênelet et travaille avec des collectivités, mais l'association des locataires à sa gouvernance n'est pas documentée."
  - critere: transparence
    valeur: partiel
    note: "La foncière communique sur son modèle et ses réalisations, mais le détail de la publication de ses comptes n'est pas confirmé."
  - critere: risque_requalification
    valeur: partiel
    note: "L'agrément ESUS sécurise la finalité sociale, mais il n'a pas la stabilité d'une reconnaissance d'utilité publique."
  - critere: redevabilite_publique
    valeur: partiel
    note: "L'agrément ESUS et la maîtrise d'ouvrage d'insertion soumettent la foncière à un cadre de contrôle, mais le détail de la reddition de comptes au public n'est pas documenté."
analyse:
  forces:
    - "Logement social écologique porté durablement par une foncière solidaire."
    - "Charges résidentielles fortement réduites pour des ménages à très faibles revenus."
    - "Clauses d'insertion obligatoires et part importante des marchés confiée à des entreprises locales."
  fragilites:
    - "Forme sociétaire : non-lucrativité dépendante de l'agrément et des statuts."
    - "Inaliénabilité statutaire et clause de dévolution non documentées."
    - "Gouvernance et place des locataires non documentées."
  leviers:
    - "Inscrire des clauses d'inaliénabilité explicites sur le parc porté."
    - "Documenter publiquement la gouvernance et le sort de l'actif."
    - "Associer les locataires à la gouvernance de la foncière."
  synthese: >
    La Foncière Chênelet est un bailleur solidaire qui porte durablement du
    logement social écologique pour les ménages les plus modestes. Sa solidité
    tient à l'agrément ESUS et à son ancrage dans l'insertion ; elle gagnerait
    à expliciter ses verrous d'inaliénabilité.
fiabilite: >
  Faits vérifiés (sources Foncière Chênelet et Impactivist, consultées en mai
  2026) : foncière solidaire fondée en 2009 par François Marty dans la mouvance
  du groupe d'insertion Chênelet, reconnaissance ESUS, agrément maîtrise
  d'ouvrage d'insertion dans plusieurs régions, construction de logement social
  écologique en matériaux sains et basse consommation, charges résidentielles
  fortement réduites, clauses d'insertion obligatoires dans les marchés de
  construction. Non confirmé : clause de dévolution, inaliénabilité statutaire,
  composition de la gouvernance, détail des comptes.
