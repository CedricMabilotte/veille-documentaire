uid: fonciere-terre-de-liens
categorie: porteur
nom: "Foncière Terre de Liens"
sous_titre: "Société d'actionnariat solidaire portant les terres agricoles"
statut_fiche: publie
forme_juridique: "Société en commandite par actions (SCA) à capital variable"
localisation: null
annee: 2006
url: "https://terredeliens.org/la-fonciere"
resume: >
  Société en commandite par actions à capital variable, créée en décembre 2006.
  Elle accumule du capital citoyen par un actionnariat solidaire pour acheter
  terres et bâtiments agricoles et en porter la propriété sur le long terme. Elle
  reste propriétaire et loue aux paysan·nes par bail rural, souvent
  environnemental. Les actionnaires ne perçoivent pas de dividende ; un principe
  de revalorisation des parts limite l'effet de l'inflation.
montage:
  type: propriete_sanctuarisee
  description: >
    La Foncière collecte l'épargne solidaire de citoyen·nes-actionnaires, dont la
    responsabilité est limitée à leur apport, et achète le foncier qu'elle
    conserve durablement. L'usage est confié aux paysan·nes par bail rural. Il
    s'agit d'un portage collectif et non d'un démembrement de propriété.
purete_juridique:
  niveau: societaire_solidaire
  commentaire: >
    Forme sociétaire (société en commandite par actions) à actionnariat solidaire,
    sans dividende ; la non-lucrativité repose sur les clauses statutaires plus
    que sur la forme elle-même.
grille:
  - critere: forme_non_lucrative
    valeur: partiel
    note: "La société en commandite par actions est une forme commerciale ; sa vocation non lucrative repose sur l'absence de dividende statutaire."
  - critere: non_lucrativite_effective
    valeur: partiel
    note: "Aucun dividende n'est versé, mais une revalorisation des parts est prévue : la valeur des titres peut progresser, fût-ce dans la limite de l'inflation."
  - critere: agrement_ig
    valeur: partiel
    note: "La Foncière relève de la finance solidaire, mais ne dispose pas d'une reconnaissance d'utilité publique comme la Fondation."
  - critere: objet_foncier_protecteur
    valeur: oui
    note: "L'objet est explicitement l'achat et le portage de long terme de terres et bâtiments agricoles."
  - critere: gestion_desinteressee
    valeur: partiel
    note: "Aucun dividende n'est versé, mais une revalorisation des parts est prévue ; la gestion n'est pas strictement désintéressée au sens fiscal."
  - critere: inalienabilite
    valeur: partiel
    note: "Le portage est de long terme, mais les actions restent cessibles et aucune inaliénabilité statutaire stricte n'est documentée."
  - critere: parts_non_cessibles
    valeur: non
    note: "Les actions de la Foncière restent cessibles ; leur revalorisation prévue rend la valeur foncière partiellement captable par les actionnaires."
  - critere: nature_protectrice
    valeur: partiel
    note: "Une société civile ou commerciale se situe en bas de l'échelle de protection, sous la fondation et la personne publique."
  - critere: clause_devolution
    valeur: inconnu
    note: "Le sort de l'actif en cas de dissolution n'est pas documenté par les sources consultées."
  - critere: independance_rendement
    valeur: oui
    note: "Aucun dividende n'est versé ; la revalorisation des parts vise seulement à limiter l'effet de l'inflation."
  - critere: ca_collegial
    valeur: partiel
    note: "La Foncière s'inscrit dans le mouvement Terre de Liens, mais la composition de sa gérance et de ses instances n'est pas détaillée."
  - critere: parties_prenantes
    valeur: partiel
    note: "L'actionnariat citoyen est large, mais la place décisionnelle des paysan·nes preneur·euses n'est pas documentée."
  - critere: transparence
    valeur: oui
    note: "La Foncière s'inscrit dans un mouvement publiant des rapports annuels et des informations sur l'épargne solidaire."
  - critere: risque_requalification
    valeur: partiel
    note: "La Foncière relève de la finance solidaire mais n'est pas reconnue d'intérêt général ; le risque de requalification fiscale ne se pose pas dans les mêmes termes que pour une fondation, sa solidité reposant sur ses clauses statutaires."
  - critere: redevabilite_publique
    valeur: partiel
    note: "La Foncière communique dans le cadre du mouvement Terre de Liens et de la finance solidaire, mais ne relève pas d'un contrôle public comparable à celui d'une FRUP."
analyse:
  forces:
    - "Mobilisation large de capital citoyen sans rémunération spéculative."
    - "Objet statutaire centré sur le portage foncier de long terme."
    - "Absence de dividende, principe de revalorisation limité à l'inflation."
  fragilites:
    - "Forme sociétaire commerciale : non-lucrativité dépendante des statuts."
    - "Actions cessibles, sans inaliénabilité statutaire stricte documentée."
    - "Clause de dévolution non documentée."
  leviers:
    - "Inscrire des clauses anti-spéculatives et d'inaliénabilité explicites."
    - "Documenter le sort de l'actif en cas de dissolution."
    - "Associer les paysan·nes preneur·euses à la gouvernance."
  synthese: >
    La Foncière est un outil puissant de mobilisation d'épargne solidaire, mais sa
    forme sociétaire la rend moins protectrice que la Fondation. Sa solidité tient
    aux clauses statutaires neutralisant la spéculation.
fiabilite: >
  Faits vérifiés : forme de société en commandite par actions à capital variable,
  création en décembre 2006, actionnariat solidaire, absence de dividende,
  principe de revalorisation des parts, location aux paysan·nes par bail rural.
  Non confirmé : clause de dévolution, inaliénabilité statutaire, composition des
  instances de gouvernance.
