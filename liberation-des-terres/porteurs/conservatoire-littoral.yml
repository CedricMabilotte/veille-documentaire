uid: conservatoire-littoral
categorie: porteur
nom: "Conservatoire du littoral"
sous_titre: "Établissement public détenant un domaine foncier inaliénable"
statut_fiche: publie
forme_juridique: "Établissement public (Conservatoire de l'espace littoral et des rivages lacustres)"
localisation: null
annee: 1975
url: "https://www.conservatoire-du-littoral.fr/"
resume: >
  Établissement public créé le 10 juillet 1975, le Conservatoire du littoral
  acquiert des terrains menacés du littoral — plus de 80 % par voie amiable —
  pour les classer dans un domaine propre inaliénable. Une aliénation ne peut être
  autorisée que par décret en Conseil d'État, sur proposition du conseil
  d'administration à la majorité des trois quarts. Cinquantenaire en 2025, le
  Conservatoire protège environ 18 % du littoral français — de l'ordre de
  220 000 hectares sur plus de 840 sites — et confie la gestion à des tiers.
montage:
  type: propriete_publique
  description: >
    Le Conservatoire acquiert le foncier et le classe dans son domaine propre, qui
    devient inaliénable. La gestion est confiée à des collectivités, syndicats
    mixtes, fondations, associations agréées ou établissements publics. En 2015,
    environ 13 % des sites étaient gérés par des associations.
purete_juridique:
  niveau: droit_public
  commentaire: >
    Établissement public relevant du droit public ; la domanialité et
    l'inaliénabilité confèrent une protection foncière maximale.
grille:
  - critere: forme_non_lucrative
    valeur: oui
    note: "Le Conservatoire est un établissement public, structurellement non lucratif."
  - critere: non_lucrativite_effective
    valeur: oui
    note: "Établissement public sans capital social ni apporteurs : aucune rémunération du capital, ni dividende, ni plus-value distribuée."
  - critere: agrement_ig
    valeur: oui
    note: "Le Conservatoire est un établissement public créé par la loi du 10 juillet 1975, investi d'une mission d'intérêt général."
  - critere: objet_foncier_protecteur
    valeur: oui
    note: "L'objet est explicitement l'acquisition de terrains menacés du littoral pour les protéger durablement."
  - critere: gestion_desinteressee
    valeur: oui
    note: "Établissement public, le Conservatoire ne fonctionne au profit d'aucun cercle restreint de personnes."
  - critere: inalienabilite
    valeur: oui
    note: "Les terrains entrent dans un domaine propre inaliénable ; l'aliénation requiert un décret en Conseil d'État."
  - critere: parts_non_cessibles
    valeur: oui
    note: "Établissement public sans capital social : il n'existe aucune part ou action appropriable, donc aucune captation possible de la valeur foncière."
  - critere: nature_protectrice
    valeur: oui
    note: "L'établissement public se situe au sommet de l'échelle de protection foncière."
  - critere: clause_devolution
    valeur: oui
    note: "La domanialité publique exclut tout retour du foncier dans un patrimoine privé."
  - critere: independance_rendement
    valeur: oui
    note: "Le Conservatoire ne dépend d'aucun investisseur attendant une plus-value sur le foncier."
  - critere: ca_collegial
    valeur: oui
    note: "Le Conservatoire dispose d'un conseil d'administration qui propose les rares aliénations à la majorité des trois quarts."
  - critere: parties_prenantes
    valeur: partiel
    note: "La gestion est confiée à des collectivités et associations, mais la place des citoyen·nes dans la gouvernance n'est pas détaillée."
  - critere: transparence
    valeur: oui
    note: "Le Conservatoire publie des informations sur son patrimoine foncier et son activité."
  - critere: risque_requalification
    valeur: oui
    note: "Établissement public investi par la loi d'une mission d'intérêt général : la qualification ne peut être remise en cause par une requalification fiscale."
  - critere: redevabilite_publique
    valeur: oui
    note: "Établissement public, le Conservatoire est soumis au contrôle de l'État et rend compte publiquement de son patrimoine et de son activité."
analyse:
  forces:
    - "Domaine propre inaliénable : protection foncière parmi les plus fortes."
    - "Aliénation soumise à un décret en Conseil d'État et à une majorité qualifiée."
    - "Acquisitions majoritairement amiables, gestion déléguée à des tiers."
  fragilites:
    - "Vocation de protection de la nature, peu adaptée au foncier agricole ou d'habitat."
    - "Relève du droit public, hors du champ du droit civil pur."
    - "Place des citoyen·nes dans la gouvernance peu détaillée."
  leviers:
    - "Mobiliser le modèle de domanialité inaliénable comme référence d'irréversibilité."
    - "Renforcer l'association des citoyen·nes à la gestion des sites."
    - "Privilégier la gestion déléguée à des associations d'intérêt général."
  synthese: >
    Le Conservatoire du littoral incarne le verrou foncier le plus solide :
    domanialité inaliénable et aliénation quasi impossible. Sa vocation reste la
    protection de la nature et son régime relève du droit public.
fiabilite: >
  Faits vérifiés : statut d'établissement public créé le 10 juillet 1975, plus de
  80 % d'acquisitions amiables, domaine propre inaliénable, aliénation par décret
  en Conseil d'État à la majorité des trois quarts, environ 18 % du littoral
  protégé (de l'ordre de 220 000 hectares sur plus de 840 sites),
  cinquantenaire de l'établissement en 2025, environ 13 % des sites gérés par
  des associations en 2015. Non confirmé : place détaillée des citoyen·nes dans
  la gouvernance, part actuelle des sites gérés par des associations.
