uid: scic-terres-de-sources
categorie: porteur
nom: "SCIC Terres de Sources"
sous_titre: "Coopérative territoriale protégeant le foncier des aires de captage"
statut_fiche: publie
forme_juridique: "Société coopérative d'intérêt collectif (SCIC) multi-acteurs"
localisation: null
annee: 2022
url: "https://www.eaudubassinrennais-collectivite.fr/blog/la-scic-terres-de-sources-est-creee/"
resume: >
  Société coopérative d'intérêt collectif multi-acteurs créée le 24 février
  2022, dans le prolongement du projet Terres de Sources lancé en 2015 par le
  syndicat de l'Eau du Bassin Rennais. La collectivité mène une politique
  d'acquisition foncière délibérée sur les zones de captage d'eau potable ; les
  terres achetées sont aménagées — haies, mares, boisements — ou mises à
  disposition d'exploitant·es agricoles engagé·es dans des pratiques
  protectrices de l'eau. La SCIC comptait 105 sociétaires à sa création,
  répartis en six collèges.
montage:
  type: propriete_publique
  description: >
    L'acquisition du foncier sur les aires de captage est portée par la
    collectivité Eau du Bassin Rennais : la terre relève d'une propriété
    publique soustraite au marché. Elle est ensuite aménagée ou mise à
    disposition d'exploitant·es agricoles, assortie de clauses contractuelles
    de pratiques protectrices de l'eau. La SCIC Terres de Sources organise les
    débouchés, notamment via les marchés publics de restauration collective,
    pour les fermes labellisées.
purete_juridique:
  niveau: civil_encadre
  commentaire: >
    Acquisition foncière publique articulée à une SCIC multi-acteurs ; montage
    coopératif fortement adossé à une politique publique de l'eau.
grille:
  - critere: forme_non_lucrative
    valeur: oui
    note: "La SCIC est une coopérative d'intérêt collectif et l'acquisition foncière relève d'une collectivité publique : structures non lucratives."
  - critere: non_lucrativite_effective
    valeur: partiel
    note: "La SCIC encadre la lucrativité par sa forme coopérative, mais peut rémunérer modérément le capital ; l'acquisition publique du foncier, elle, exclut toute rémunération."
  - critere: agrement_ig
    valeur: oui
    note: "Le portage public du foncier sur les aires de captage relève d'une mission d'intérêt général de protection de l'eau potable."
  - critere: objet_foncier_protecteur
    valeur: oui
    note: "L'objet est explicitement l'acquisition et la protection du foncier des zones de captage par des pratiques agricoles compatibles avec la qualité de l'eau."
  - critere: gestion_desinteressee
    valeur: oui
    note: "La collectivité publique et la SCIC multi-acteurs fonctionnent hors profit d'un cercle restreint de personnes."
  - critere: inalienabilite
    valeur: oui
    note: "Le foncier acquis par la collectivité sur les aires de captage relève d'une propriété publique, fortement protégée contre la revente."
  - critere: parts_non_cessibles
    valeur: oui
    note: "Le foncier appartient à la collectivité publique, sans capital social appropriable : aucune part ne porte la valeur foncière."
  - critere: nature_protectrice
    valeur: oui
    note: "L'acquisition par une collectivité publique place le foncier au sommet de l'échelle de protection."
  - critere: clause_devolution
    valeur: oui
    note: "Le foncier relevant de la propriété publique, aucun retour dans un patrimoine privé n'est possible."
  - critere: independance_rendement
    valeur: oui
    note: "L'acquisition publique du foncier ne dépend d'aucun investisseur attendant une plus-value ; la SCIC encadre la rémunération du capital."
  - critere: ca_collegial
    valeur: oui
    note: "La SCIC réunit 105 sociétaires en six collèges (producteurs, transformateurs, collectivités, associations et citoyen·nes, partenaires financiers, salarié·es)."
  - critere: parties_prenantes
    valeur: oui
    note: "Les six collèges de la SCIC associent producteurs, collectivités, citoyen·nes et autres parties prenantes à la gouvernance."
  - critere: transparence
    valeur: partiel
    note: "Le projet est largement documenté publiquement, mais le détail de la publication des comptes de la SCIC n'est pas confirmé."
  - critere: risque_requalification
    valeur: oui
    note: "Le portage public du foncier sur les aires de captage relève d'une compétence d'intérêt général stable, non exposée à une requalification fiscale."
  - critere: redevabilite_publique
    valeur: oui
    note: "La collectivité Eau du Bassin Rennais rend compte publiquement de sa politique foncière et la SCIC associe collectivités et citoyen·nes."
analyse:
  forces:
    - "Foncier des aires de captage acquis en propriété publique, fortement protégé."
    - "SCIC multi-acteurs à six collèges associant largement les parties prenantes."
    - "Débouchés sécurisés par les marchés publics pour les fermes labellisées."
  fragilites:
    - "Modèle adossé à une politique publique locale, difficilement reproductible sans collectivité volontaire."
    - "La SCIC, de forme coopérative, peut rémunérer modérément le capital."
    - "Détail de la publication des comptes non confirmé."
  leviers:
    - "Capitaliser l'expérience comme référence de foncière territoriale de l'eau."
    - "Articuler systématiquement clauses de pratiques et débouchés en restauration collective."
    - "Documenter publiquement les comptes de la SCIC."
  synthese: >
    Terres de Sources combine acquisition foncière publique sur les aires de
    captage et SCIC multi-acteurs : un modèle territorial qui protège
    durablement le foncier de l'eau. Sa singularité tient à son adossement à
    une politique publique locale.
fiabilite: >
  Faits vérifiés (sources Eau du Bassin Rennais, Banque des Territoires et
  Actu-Environnement, consultées en mai 2026) : projet Terres de Sources lancé
  en 2015 par le syndicat de l'Eau du Bassin Rennais, SCIC créée le 24 février
  2022, 105 sociétaires à la création répartis en six collèges, acquisition
  publique de foncier sur les aires de captage puis mise à disposition assortie
  de clauses de pratiques, débouchés via les marchés publics de restauration
  collective. Non confirmé : surfaces acquises à jour, détail des comptes de la
  SCIC.
