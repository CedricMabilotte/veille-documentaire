uid: fonciere-antidote
categorie: porteur
nom: "Antidote"
sous_titre: "Fonds de dotation cédant l'usage de lieux par bail emphytéotique de 99 ans"
statut_fiche: publie
forme_juridique: "Fonds de dotation (loi du 4 août 2008)"
localisation: null
annee: 2021
url: "https://aventure-antidote.org/comment-ca-marche/notre-fonctionnement/"
resume: >
  Fonds de dotation, désigné aujourd'hui sous le nom « Antidote » (anciennement
  « La Foncière Antidote »), qui détient la propriété de lieux acquis ou reçus par dons,
  legs et donations, et en cède l'usage aux collectifs par un bail emphytéotique
  de 99 ans. Il est fondé et orienté par l'association « Les Passagères de
  l'usage », que chaque lieu rejoignant le projet doit intégrer. Le
  fonctionnement est explicitement non capitaliste, sans parts sociales ni
  rémunération du capital : la propriété est transformée en propriété d'usage.
  Le fonds a vocation à protéger des fermes comme des lieux culturels, des
  locaux associatifs ou des espaces d'habitat collectif.
montage:
  type: demembrement
  description: >
    Le fonds de dotation conserve durablement la propriété des lieux et la
    soustrait au marché ; l'usage est confié aux collectifs occupant·es par un
    bail emphytéotique de 99 ans, qui leur ouvre un droit réel sur le lieu sans
    leur en transférer la propriété. L'association « Les Passagères de l'usage »
    nomme les administrateur·rices du fonds et définit ses orientations : le
    montage dissocie nettement la propriété protégée de l'usage confié, sans
    recourir à l'usufruit civil plafonné à 30 ans.
purete_juridique:
  niveau: civil_encadre
  commentaire: >
    Fonds de dotation de droit privé non lucratif, sans capital lucratif ; la
    cession d'usage par bail emphytéotique de 99 ans sécurise l'usage bien
    au-delà du plafond de 30 ans propre aux démembrements civils.
grille:
  - critere: forme_non_lucrative
    valeur: oui
    note: "Le fonds de dotation est une personne morale de droit privé structurellement non lucrative, sans parts sociales ni capital rémunéré."
  - critere: non_lucrativite_effective
    valeur: oui
    note: "Fonctionnement explicitement non capitaliste, sans parts sociales ni rémunération du capital : ni dividende, ni intérêt, ni plus-value distribuée."
  - critere: agrement_ig
    valeur: partiel
    note: "Le fonds de dotation est créé sans agrément ; l'éligibilité au régime de l'intérêt général dépend de son objet et de son fonctionnement effectif."
  - critere: objet_foncier_protecteur
    valeur: oui
    note: "L'objet du fonds est explicitement de soustraire des lieux au marché immobilier et d'en transformer la propriété en propriété d'usage."
  - critere: gestion_desinteressee
    valeur: oui
    note: "Le fonctionnement est non capitaliste, sans rémunération du capital ; l'association fondatrice oriente le fonds dans un but désintéressé."
  - critere: inalienabilite
    valeur: partiel
    note: "Le fonds conserve la propriété des lieux et la cède en usage pour 99 ans ; le caractère consomptible ou non de la dotation n'est pas confirmé par les sources consultées."
  - critere: parts_non_cessibles
    valeur: oui
    note: "Le fonds de dotation fonctionne sans parts sociales ni capital appropriable : aucun titre cessible, donc aucune captation possible de la valeur foncière."
  - critere: nature_protectrice
    valeur: partiel
    note: "Le fonds de dotation se situe à un niveau de protection intermédiaire, sous la fondation reconnue d'utilité publique et la personne publique."
  - critere: clause_devolution
    valeur: partiel
    note: "Un fonds de dotation dévolu son actif à un organisme à but non lucratif en cas de dissolution ; le détail des clauses statutaires du fonds n'est pas documenté."
  - critere: independance_rendement
    valeur: oui
    note: "Le fonds fonctionne sans parts sociales ni investisseur·euses attendant une plus-value : aucune logique de rendement ne pèse sur le foncier."
  - critere: ca_collegial
    valeur: partiel
    note: "Les administrateur·rices du fonds sont nommé·es par l'association « Les Passagères de l'usage » ; la collégialité effective n'est pas détaillée."
  - critere: parties_prenantes
    valeur: oui
    note: "Chaque lieu rejoignant le projet intègre l'association « Les Passagères de l'usage » et participe ainsi à l'orientation du fonds."
  - critere: transparence
    valeur: partiel
    note: "Le fonctionnement du fonds est documenté publiquement, notamment par une monographie ; le détail de la publication des comptes n'est pas confirmé."
  - critere: redevabilite_publique
    valeur: partiel
    note: "Un fonds de dotation est soumis à des obligations déclaratives auprès de l'État ; la reddition de comptes au public n'est pas détaillée par les sources."
analyse:
  forces:
    - "Fonctionnement non capitaliste, sans parts sociales ni rémunération du capital."
    - "Cession d'usage par bail emphytéotique de 99 ans, durée bien supérieure au plafond de 30 ans."
    - "Gouvernance ancrée dans l'association des lieux, « Les Passagères de l'usage »."
  fragilites:
    - "Caractère consomptible ou non de la dotation non confirmé."
    - "Fonds de dotation créé sans agrément : la solidité dépend des statuts."
    - "Détail de la collégialité et de la transparence comptable non documenté."
  leviers:
    - "Inscrire et publier le caractère non consomptible de la dotation."
    - "Documenter publiquement les statuts et la composition du conseil d'administration."
    - "Confirmer l'éligibilité au régime fiscal de l'intérêt général."
  synthese: >
    Antidote est un montage rigoureux de propriété d'usage :
    propriété protégée par un fonds de dotation non capitaliste, usage confié
    pour 99 ans, gouvernance portée par les lieux eux-mêmes. Sa marge de
    progression tient à l'explicitation du caractère non consomptible de la
    dotation et à la publication de ses statuts.
fiabilite: >
  Faits vérifiés (sources Aventure Antidote, centre de ressources Terre de Liens
  et presse spécialisée, consultées en mai 2026) : statut de fonds de dotation
  (loi du 4 août 2008), propriété de lieux acquis ou reçus par dons et legs,
  cession d'usage par bail emphytéotique de 99 ans, association fondatrice
  « Les Passagères de l'usage » que chaque lieu doit intégrer, fonctionnement
  non capitaliste sans parts sociales, vocation large incluant fermes, lieux
  culturels et locaux associatifs, documentation par la monographie « IFAC —
  Monographies #7 ». Non confirmé : caractère consomptible ou non de la
  dotation, détail des statuts, composition du conseil d'administration,
  éligibilité fiscale à l'intérêt général.
