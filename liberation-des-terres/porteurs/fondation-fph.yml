uid: fondation-fph
categorie: porteur
nom: "Fondation Charles Léopold Mayer pour le Progrès de l'Homme"
sous_titre: "Fondation propriétaire du domaine de Villarceaux"
statut_fiche: publie
forme_juridique: "Fondation (de droit suisse selon les sources ; forme exacte au regard du droit français non confirmée)"
localisation: null
annee: 1982
url: "https://www.fph.ch/article16_fr.html"
resume: >
  Fondation soutenant des recherches et expérimentations d'intérêt général,
  existant depuis 1982 et dont le siège est à Lausanne. Elle
  est propriétaire du domaine de la Bergerie de Villarceaux, d'environ 600
  hectares, qu'elle met à disposition pour une transition agroécologique. Elle en
  conserve la pleine propriété et en confie l'exploitation à des structures
  tierces. La forme exacte de la fondation au regard du droit français n'est pas
  confirmée par les sources, qui mentionnent un cadre de droit suisse.
montage:
  type: propriete_sanctuarisee
  description: >
    La Fondation détient en pleine propriété le domaine de Villarceaux et confie
    l'usage agricole à des structures d'exploitation tierces. Il s'agit d'une
    propriété de fondation assortie d'une exploitation tierce, et non d'un
    démembrement strict.
purete_juridique:
  niveau: civil_encadre
  commentaire: >
    Fondation non lucrative offrant une bonne protection du foncier, mais dont la
    forme exacte au regard du droit français reste à confirmer.
