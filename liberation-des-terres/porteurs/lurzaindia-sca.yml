uid: lurzaindia-sca
categorie: porteur
nom: "Lurzaindia (SCA)"
sous_titre: "Foncière citoyenne du Pays Basque portant les terres agricoles"
statut_fiche: publie
forme_juridique: "Société en commandite par actions (SCA)"
localisation: null
annee: 2013
url: "https://lurzaindia.eu/"
resume: >
  Foncière citoyenne du Pays Basque, constituée en 2013 sous la forme d'une
  société en commandite par actions. Elle prend la suite du GFAM Lurra, né dans
  les années 1970. Elle mobilise l'épargne populaire — environ 3 674
  actionnaires solidaires — pour acheter des terres, en conserver durablement la
  propriété et les confier à des agriculteur·rices par baux de long terme. Elle
  détient environ 480 hectares répartis sur de nombreuses fermes, où une
  trentaine d'exploitant·es sont installé·es selon son bilan public.
montage:
  type: propriete_sanctuarisee
  description: >
    Lurzaindia, foncière citoyenne, achète les terres grâce à l'épargne
    populaire et en conserve la propriété sur le long terme. L'usage est confié
    aux agriculteur·rices par des baux de long terme. Le modèle est analogue à celui
    de la Foncière Terre de Liens, à l'échelle régionale du Pays Basque ; il
    s'agit d'un portage collectif et non d'un démembrement de propriété.
purete_juridique:
  niveau: societaire
  commentaire: >
    Foncière de forme sociétaire (société en commandite par actions) reposant
    sur un actionnariat citoyen ; la non-lucrativité dépend des clauses
    statutaires encadrant la rémunération du capital.
grille:
  - critere: forme_non_lucrative
    valeur: partiel
    note: "La société en commandite par actions est une forme commerciale ; sa vocation non lucrative repose sur les clauses statutaires encadrant le capital."
  - critere: agrement_ig
    valeur: partiel
    note: "Lurzaindia relève de la finance solidaire et de l'installation paysanne, mais ne dispose pas d'une reconnaissance d'utilité publique."
  - critere: objet_foncier_protecteur
    valeur: oui
    note: "L'objet est explicitement l'achat et le portage de long terme de terres agricoles pour l'installation paysanne."
  - critere: gestion_desinteressee
    valeur: partiel
    note: "L'actionnariat est citoyen et l'objet solidaire, mais la non-lucrativité au sens fiscal n'est pas documentée."
  - critere: inalienabilite
    valeur: partiel
    note: "Le portage est de long terme, mais aucune clause d'inaliénabilité stricte n'est documentée et les actions restent cessibles."
  - critere: nature_protectrice
    valeur: partiel
    note: "Une société commerciale se situe en bas de l'échelle de protection, sous la fondation et la personne publique."
  - critere: clause_devolution
    valeur: inconnu
    note: "Le sort de l'actif en cas de dissolution n'est pas documenté ; une société en commandite par actions partage en principe son boni de liquidation entre actionnaires, sauf clause statutaire contraire."
  - critere: independance_rendement
    valeur: partiel
    note: "La forme de société en commandite par actions n'exclut pas par construction la rémunération du capital ; les clauses ne sont pas détaillées."
  - critere: ca_collegial
    valeur: partiel
    note: "L'actionnariat citoyen est large, mais la composition de la gérance et des instances de Lurzaindia n'est pas détaillée."
  - critere: parties_prenantes
    valeur: partiel
    note: "L'actionnariat citoyen est large, mais la place décisionnelle des agriculteur·rices preneur·euses n'est pas documentée."
  - critere: transparence
    valeur: partiel
    note: "Lurzaindia communique sur sa collecte et son patrimoine, mais le détail de sa transparence comptable n'est pas documenté."
  - critere: risque_requalification
    valeur: partiel
    note: "Lurzaindia relève de la finance solidaire mais n'est pas reconnue d'intérêt général ; le risque de requalification fiscale ne se pose pas dans les mêmes termes que pour une fondation, sa solidité reposant sur ses clauses statutaires."
  - critere: redevabilite_publique
    valeur: partiel
    note: "Lurzaindia communique sur son activité auprès de ses actionnaires, mais ne relève pas d'un contrôle public comparable à celui d'une fondation reconnue d'utilité publique."
analyse:
  forces:
    - "Foncière citoyenne ancrée régionalement, forte mobilisation d'épargne populaire."
    - "Continuité depuis le GFAM Lurra des années 1970."
    - "Objet statutaire centré sur le portage foncier et l'installation paysanne."
  fragilites:
    - "Forme de société en commandite par actions : actions cessibles, non-lucrativité non garantie par construction."
    - "Absence de clause d'inaliénabilité stricte documentée."
    - "Gouvernance et clause de dévolution non documentées."
  leviers:
    - "Inscrire des clauses anti-spéculatives explicites encadrant la cession des actions."
    - "Documenter publiquement la gouvernance et le sort de l'actif en cas de dissolution."
    - "Associer les agriculteur·rices preneur·euses à la gouvernance de la foncière."
  synthese: >
    Lurzaindia est une foncière citoyenne efficace pour l'installation paysanne
    au Pays Basque, sur le modèle de la Foncière Terre de Liens. Sa pureté
    juridique reste celle d'une structure sociétaire : la solidité dépendra des
    clauses encadrant le capital et l'inaliénabilité du foncier.
fiabilite: >
  Faits vérifiés (bilan public Lurzaindia consulté en mai 2026) : forme de
  société en commandite par actions, création en 2013, suite du GFAM Lurra des
  années 1970, environ 480 hectares, une trentaine d'agriculteur·rices
  installé·es, environ 3 674 actionnaires solidaires, près de 1,57 million
  d'euros investis. Ces chiffres datent du bilan publié par la foncière et
  évoluent au fil de ses campagnes de financement. Non confirmé : clauses
  statutaires d'inaliénabilité, composition de la gouvernance, clause de
  dévolution.
