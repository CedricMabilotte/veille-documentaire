uid: fondation-terre-de-liens
categorie: porteur
nom: "Fondation Terre de Liens"
sous_titre: "Fondation reconnue d'utilité publique portant le foncier agricole"
statut_fiche: publie
forme_juridique: "Fondation reconnue d'utilité publique (FRUP)"
localisation: null
annee: 2013
url: "https://terredeliens.org/national/foire-aux-questions/tout-savoir-sur-les-donations/"
resume: >
  Fondation reconnue d'utilité publique du mouvement Terre de Liens, créée en mai
  2013 en succession d'un fonds de dotation. Elle collecte dons, terres et fermes,
  porte du foncier agricole et accompagne l'acquisition et la transmission de
  fermes. Elle reçoit notamment des donations en démembrement : donation de
  nue-propriété avec réserve d'usufruit, ou donation temporaire d'usufruit d'une
  durée minimale de trois ans.
montage:
  type: demembrement
  description: >
    La Fondation peut acquérir la pleine propriété par dons et legs, mais aussi la
    seule nue-propriété, le donateur conservant l'usufruit de son vivant. Elle
    peut également recevoir un usufruit temporaire. Une fondation ouverte aux
    collectivités pour le portage du foncier agricole a par ailleurs été annoncée.
purete_juridique:
  niveau: pur
  commentaire: >
    La reconnaissance d'utilité publique constitue le statut le plus protecteur
    pour porter durablement un foncier hors marché.
grille:
  - critere: forme_non_lucrative
    valeur: oui
    note: "La Fondation est une fondation reconnue d'utilité publique, forme structurellement non lucrative."
  - critere: agrement_ig
    valeur: oui
    note: "La reconnaissance d'utilité publique est une qualité officielle reconnue par l'État après instruction."
  - critere: objet_foncier_protecteur
    valeur: oui
    note: "L'objet de la Fondation porte explicitement sur le portage du foncier agricole et sa transmission."
  - critere: gestion_desinteressee
    valeur: oui
    note: "Le statut de FRUP suppose une gestion désintéressée contrôlée par l'État."
  - critere: inalienabilite
    valeur: partiel
    note: "Le statut de FRUP protège fortement le foncier, mais une clause d'inaliénabilité spécifique parcelle par parcelle n'est pas détaillée."
  - critere: nature_protectrice
    valeur: oui
    note: "La fondation reconnue d'utilité publique se situe au sommet de l'échelle de protection après la personne publique."
  - critere: clause_devolution
    valeur: oui
    note: "Le statut de FRUP impose une dévolution désintéressée de l'actif en cas de dissolution, sans retour au privé."
  - critere: independance_rendement
    valeur: oui
    note: "Une fondation ne dépend pas d'investisseur·euses attendant une plus-value ou un dividende sur le foncier."
  - critere: ca_collegial
    valeur: oui
    note: "Le statut de FRUP impose un conseil d'administration pluraliste contrôlé par l'État."
  - critere: parties_prenantes
    valeur: partiel
    note: "Le mouvement associe donateur·rices et bénévoles ; la fondation ouverte aux collectivités élargit les parties prenantes, mais le détail n'est pas documenté."
  - critere: transparence
    valeur: oui
    note: "La Fondation publie un rapport annuel détaillant son activité et ses acquisitions."
  - critere: risque_requalification
    valeur: oui
    note: "La reconnaissance d'utilité publique, accordée par décret après instruction de l'État, sécurise durablement la qualité d'intérêt général et expose à un risque de requalification fiscale très faible."
  - critere: redevabilite_publique
    valeur: oui
    note: "Le statut de FRUP impose un contrôle de l'État et la publication d'un rapport annuel ; la Fondation rend compte publiquement de son activité."
analyse:
  forces:
    - "Statut de fondation reconnue d'utilité publique, le plus protecteur en droit français."
    - "Capacité à recevoir dons, legs et donations en démembrement."
    - "Transparence assurée par un rapport annuel public."
  fragilites:
    - "Clause d'inaliénabilité spécifique du foncier porté non détaillée."
    - "Place décisionnelle des paysan·nes preneur·euses peu documentée."
    - "Le renouvellement des usufruits temporaires reçus dépend de volontés futures."
  leviers:
    - "Inscrire des clauses d'inaliénabilité explicites sur le foncier porté."
    - "Développer la fondation ouverte aux collectivités pour ancrer le tripartisme."
    - "Renforcer la représentation des usager·es dans la gouvernance."
  synthese: >
    La Fondation Terre de Liens offre le cadre le plus solide du dispositif :
    statut d'utilité publique, dévolution désintéressée, transparence. Sa marge de
    progression tient à l'explicitation des verrous d'inaliénabilité et à
    l'ouverture de la gouvernance.
fiabilite: >
  Faits vérifiés : statut de fondation reconnue d'utilité publique créée en mai
  2013 en succession d'un fonds de dotation, mission de portage du foncier
  agricole, réception de
  donations en démembrement (nue-propriété avec réserve d'usufruit, usufruit
  temporaire d'au moins trois ans), création annoncée d'une fondation ouverte aux
  collectivités. Non confirmé : clauses d'inaliénabilité parcelle par parcelle,
  composition détaillée de la gouvernance.
