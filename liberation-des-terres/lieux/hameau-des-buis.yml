uid: hameau-des-buis
categorie: lieu
nom: "Le Hameau des Buis"
sous_titre: "Habitat intergénérationnel et ferme-école en Ardèche"
statut_fiche: publie
forme_juridique: null
localisation:
  commune: "Lablachère"
  departement: "Ardèche (07)"
  region: "Auvergne-Rhône-Alpes"
annee: null
url: "https://hameaudesbuis.org/"
resume: >
  Lieu d'habitat intergénérationnel et de ferme-école situé en sud Ardèche, porté
  autour de l'association La Ferme des Enfants. Le foncier est détenu par une
  société civile dont les associés sont l'association et une SARL de soutien aux
  projets éthiques. Les habitant·es ne sont pas associés mais créanciers de la
  société : ils consentent un prêt en viager en échange d'un droit de jouissance
  d'un logement. Les sources mentionnent une évolution vers une organisation
  coopérative, non entièrement confirmée.
montage:
  type: propriete_collective
  nu_proprietaire: "Société civile « Le Hameau des Buis » (associés : association La Ferme des Enfants et SARL MV Finances)"
  usufruitier: "Association La Ferme des Enfants (décision finale) et habitant·es titulaires d'un droit de jouissance"
  description: >
    Le foncier est porté par une société civile dont les associés sont
    l'association La Ferme des Enfants et une SARL de soutien aux projets
    éthiques. Le pouvoir de décision final revient à l'association d'intérêt
    général. Les habitant·es, non associés, sont créanciers : ils prêtent en
    viager à la société et reçoivent un droit de jouissance d'un logement. Les
    sources évoquent une évolution vers une SAS coopérative à gouvernance
    partagée, non entièrement confirmée.
purete_juridique:
  niveau: societaire
  commentaire: >
    Foncier porté par une société civile dont une SARL est associée ; la cohérence
    d'intérêt général repose sur le pouvoir de décision final laissé à
    l'association.
grille:
  - critere: foncier_hors_marche
    valeur: partiel
    note: "Le foncier est porté collectivement par une société civile, mais une SARL en est associée et les parts sociales restent cessibles."
  - critere: montage_documente
    valeur: partiel
    note: "Le montage d'origine est documenté, mais l'évolution vers une SAS coopérative n'est pas entièrement confirmée."
  - critere: irreversibilite
    valeur: partiel
    note: "Le pouvoir de décision final de l'association protège le lieu, mais aucune clause d'inaliénabilité n'est documentée."
  - critere: origine_non_speculative
    valeur: partiel
    note: "Le foncier est financé par des prêts en viager des habitant·es, sans plus-value attendue, mais une SARL participe au capital."
  - critere: usage_interet_general
    valeur: oui
    note: "Habitat intergénérationnel, ferme-école et pédagogie servent un intérêt dépassant les seuls résidents."
  - critere: non_lucratif_global
    valeur: partiel
    note: "L'association est non lucrative et porte la décision finale, mais une SARL est associée à la société civile."
  - critere: ancrage_territorial
    valeur: oui
    note: "Le lieu est implanté en sud Ardèche, proche de l'écosite des Amanins, avec une vocation pédagogique ouverte."
  - critere: gouvernance_collective
    valeur: partiel
    note: "La décision finale revient à l'association ; les habitant·es sont créanciers et non associés, ce qui limite leur place décisionnelle."
  - critere: tripartisme
    valeur: inconnu
    note: "L'association du voisinage et des pouvoirs publics à la gouvernance n'est pas documentée."
  - critere: perennite_gouvernance
    valeur: partiel
    note: "Le viager organise une forme de transmission, et une évolution coopérative est évoquée mais non confirmée."
analyse:
  forces:
    - "Pouvoir de décision final confié à une association d'intérêt général."
    - "Montage de viager permettant de financer le foncier sans plus-value spéculative."
    - "Vocation pédagogique et intergénérationnelle clairement affirmée."
  fragilites:
    - "Présence d'une SARL associée à la société civile portant le foncier."
    - "Habitant·es créanciers et non associés : place décisionnelle limitée."
    - "Évolution vers une SAS coopérative non confirmée par les sources."
  leviers:
    - "Confirmer et documenter l'évolution vers une gouvernance coopérative partagée."
    - "Inscrire des clauses anti-spéculatives sur les parts de la société civile."
    - "Élargir la place décisionnelle des habitant·es."
  synthese: >
    Le Hameau des Buis articule un foncier collectif et une décision finale
    associative d'intérêt général. La présence d'une SARL et le statut de
    créancier des habitant·es invitent à clarifier l'évolution coopérative
    annoncée.
fiabilite: >
  Faits vérifiés : société civile portant le foncier, associés étant l'association
  La Ferme des Enfants et la SARL MV Finances, habitant·es créanciers via prêt en
  viager contre droit de jouissance, pouvoir de décision final de l'association.
  Non confirmé : situation juridique actuelle exacte, évolution vers une SAS
  coopérative, année de création.
