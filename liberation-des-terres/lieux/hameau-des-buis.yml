uid: hameau-des-buis
categorie: lieu
nom: "Le Hameau des Buis"
sous_titre: "Habitat intergénérationnel et ferme-école en Ardèche"
statut_fiche: publie
forme_juridique: null
localisation:
  commune: "Lablachère"
  departement: "Ardèche (07)"
  region: "Auvergne-Rhône-Alpes"
annee: 2003
url: "https://hameaudesbuis.org/"
resume: >
  Lieu d'habitat intergénérationnel et de ferme-école situé en sud Ardèche, porté
  autour de l'association La Ferme des Enfants. La société civile « Le Hameau des
  Buis » qui détient le foncier a été constituée en 2003 ; ses associés sont
  l'association et une SARL de soutien aux projets éthiques. Le Hameau est
  aujourd'hui organisé en SAS coopérative à gouvernance partagée. Les habitant·es
  ne sont pas associés mais créanciers de la société : ils consentent un prêt en
  viager en échange d'un droit de jouissance d'un logement.
montage:
  type: propriete_collective
  nu_proprietaire: "Société civile « Le Hameau des Buis » (associés : association La Ferme des Enfants et SARL MV Finances)"
  usufruitier: "Association La Ferme des Enfants (décision finale) et habitant·es titulaires d'un droit de jouissance"
  description: >
    Le foncier est porté par une société civile constituée en 2003, dont les
    associés sont l'association La Ferme des Enfants et une SARL de soutien aux
    projets éthiques. Le pouvoir de décision final revient à l'association
    d'intérêt général. Les habitant·es, non associés, sont créanciers : ils
    prêtent en viager à la société et reçoivent un droit de jouissance d'un
    logement. Le Hameau a évolué vers une SAS coopérative à gouvernance partagée,
    qui constitue son organisation actuelle.
purete_juridique:
  niveau: societaire
  commentaire: >
    Foncier porté par une société civile dont une SARL est associée ; la cohérence
    d'intérêt général repose sur le pouvoir de décision final laissé à
    l'association.
