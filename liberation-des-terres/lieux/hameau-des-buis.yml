uid: hameau-des-buis
categorie: lieu
nom: "Le Hameau des Buis"
sous_titre: "Habitat intergénérationnel et ferme-école en Ardèche"
statut_fiche: publie
forme_juridique: null
localisation:
  commune: "Lablachère"
  departement: "Ardèche (07)"
  region: "Auvergne-Rhône-Alpes"
annee: 2003
url: "https://hameaudesbuis.org/"
resume: >
  Lieu d'habitat intergénérationnel et de ferme-école situé en sud Ardèche, sur
  un domaine d'environ 6 hectares. Le foncier, d'abord porté par une société
  civile constituée en 2003, est aujourd'hui détenu par la SAS coopérative
  Hameau des Buis, créée le 28 janvier 2023 à la suite de la transformation de
  cette société civile. Les habitant·es sont membres de la coopérative et le
  lieu fonctionne en gouvernance partagée. L'association cofondatrice La Ferme
  des Enfants, qui portait le projet pédagogique, a quitté le Hameau des Buis
  en 2021 à l'issue d'un conflit ; une école demeure néanmoins sur place.
montage:
  type: propriete_collective
  nu_proprietaire: "SAS coopérative Hameau des Buis (créée le 28 janvier 2023, en succession de la société civile de 2003)"
  usufruitier: "Membres de la SAS coopérative Hameau des Buis, habitant·es du lieu en gouvernance partagée"
  description: >
    Le foncier a d'abord été porté par une société civile constituée en 2003.
    À la suite d'un conflit ayant conduit au départ de l'association
    cofondatrice La Ferme des Enfants en 2021, le collectif a transformé cette
    société civile en SAS coopérative, constituée le 28 janvier 2023, jugée
    mieux adaptée à une gouvernance partagée. Les habitant·es sont membres de
    la coopérative et décident collectivement du devenir du lieu. La nature
    exacte des titres d'occupation des logements et les clauses statutaires de
    la coopérative ne sont pas détaillées par les sources publiques.
