fiabilite: >
  Faits vérifiés (sources Hameau des Buis et presse, consultées en mai 2026) :
  société civile constituée en 2003 portant le foncier, conflit ayant conduit
  au départ de l'association cofondatrice La Ferme des Enfants en 2021
  (protocole d'accord sur son départ signé en octobre 2021), constitution de la
  SAS coopérative Hameau des Buis le 28 janvier 2023 en succession de la société
  civile, domaine d'environ 6 hectares, habitat intergénérationnel et
  ferme-école. Non confirmé : clauses statutaires de la SAS coopérative,
  caractère anti-spéculatif du verrouillage des parts, nature exacte des titres
  d'occupation des logements.
