fiabilite: >
  Faits vérifiés : abandon du projet d'aéroport en 2018, création du fonds de
  dotation « La Terre en commun » fin 2018, environ 700 000 euros collectés en
  moins d'un an, dons irrévocables sans parts de capital. Non confirmé :
  acquisitions et surfaces récentes 2023-2024, caractère non consomptible de la
  dotation, montages d'usage et gouvernance.
