uid: larzac
categorie: lieu
nom: "Terres du Larzac"
sous_titre: "Plateau agricole géré par une société civile de droit privé"
statut_fiche: publie
forme_juridique: null
localisation:
  commune: "La Cavalerie / Millau"
  departement: "Aveyron (12)"
  region: "Occitanie"
annee: 1985
url: "https://larzac.org/accueil/un-territoire-organise/gestion-fonciere/sctl/"
resume: >
  Environ 6 300 hectares du plateau du Larzac, rachetés par l'État pour
  l'extension d'un camp militaire (projet abandonné en 1981), restent propriété
  publique. La Société Civile des Terres du Larzac (SCTL), constituée le 29 avril
  1985, détient ce foncier par un bail emphytéotique de 99 ans conclu avec l'État
  (échéance 2083) et attribue l'usage aux paysan·nes par des baux de long terme. Le
  dispositif fonctionne comme un office foncier local et a favorisé une hausse du
  nombre de paysan·nes.
montage:
  type: propriete_publique
  nu_proprietaire: "État (propriété publique issue du rachat foncier)"
  usufruitier: "Titulaire de l'usage : Société Civile des Terres du Larzac (SCTL), preneuse d'un bail emphytéotique de 99 ans consenti par l'État"
  description: >
    L'État demeure propriétaire de l'ensemble du foncier. La SCTL, société civile
    de droit privé, en détient l'usage par un bail emphytéotique conclu avec
    l'État — d'abord de 60 ans puis porté à 99 ans (maximum légal), avec une
    échéance en 2083 — et met les terres à disposition des paysan·nes via des baux
    de long terme. La SCTL n'est pas propriétaire : elle est preneuse à bail
    emphytéotique. C'est ce bail de 99 ans, et non la seule domanialité, qui
    fonde l'irréversibilité du dispositif.
purete_juridique:
  niveau: public
  commentaire: >
    Propriété publique de l'État, fortement protectrice, assortie d'un bail
    emphytéotique de 99 ans consenti à une société civile attribuant l'usage de
    manière collective.
grille:
  - critere: foncier_hors_marche
    valeur: oui
    note: "Le foncier est propriété de l'État et géré par la SCTL : il n'est pas destiné au marché libre."
  - critere: montage_documente
    valeur: oui
    note: "Le montage propriété publique / gestion par la SCTL / baux aux paysan·nes est public et documenté."
  - critere: irreversibilite
    valeur: oui
    note: "Le bail emphytéotique de 99 ans conclu entre l'État et la SCTL (échéance 2083), adossé à la propriété publique du plateau, soustrait durablement le foncier à l'appropriation spéculative."
  - critere: origine_non_speculative
    valeur: oui
    note: "Le foncier a été acquis par l'État dans le cadre d'un rachat foncier public, hors logique de plus-value."
  - critere: usage_interet_general
    valeur: oui
    note: "L'agriculture, notamment l'élevage ovin, et la revitalisation du plateau servent un intérêt général territorial."
  - critere: non_lucratif_global
    valeur: oui
    note: "Le montage repose sur la propriété publique et une société civile attribuant l'usage, sans captation de plus-value foncière."
  - critere: ancrage_territorial
    valeur: oui
    note: "La SCTL a permis une hausse du nombre de paysan·nes d'environ 20 %, signe d'un fort ancrage territorial."
  - critere: gouvernance_collective
    valeur: oui
    note: "Les associés de la SCTL sont les personnes physiques et morales utilisant les terres et bâtiments confiés."
  - critere: tripartisme
    valeur: partiel
    note: "La propriété de l'État implique la puissance publique, mais l'association du voisinage et des citoyen·nes n'est pas documentée."
  - critere: perennite_gouvernance
    valeur: oui
    note: "La SCTL fonctionne en continu depuis 1985 et attribue l'usage par des baux de long terme."
analyse:
  forces:
    - "Propriété publique de l'État adossée à un bail emphytéotique de 99 ans : irréversibilité parmi les plus fortes."
    - "Office foncier local éprouvé depuis 1985, usage attribué aux usager·es eux-mêmes."
    - "Effet de revitalisation mesurable du nombre de paysan·nes installés."
  fragilites:
    - "Le bail emphytéotique a un terme (2083) : sa reconduction dépendra d'une volonté future."
    - "Ouverture du modèle au-delà du cercle des usager·es du plateau peu documentée."
    - "Modèle singulier, difficilement reproductible hors d'un rachat foncier public."
  leviers:
    - "Anticiper la reconduction du bail emphytéotique avant son terme de 2083."
    - "Documenter l'articulation avec les collectivités et le territoire."
    - "Capitaliser l'expérience comme référence d'office foncier territorial."
  synthese: >
    Le Larzac combine la sécurité de la propriété publique et celle d'un bail
    emphytéotique de 99 ans, avec une gestion attribuée collectivement aux
    usager·es. Sa principale dépendance reste la reconduction du bail à son
    échéance, mais le modèle fait figure de référence historique.
fiabilite: >
  Faits vérifiés : propriété de l'État sur environ 6 300 hectares, SCTL
  constituée le 29 avril 1985 après une recherche de structure engagée dès
  décembre 1982, détention du foncier par un bail emphytéotique de 99 ans
  (échéance 2083), attribution de l'usage par baux de long terme, hausse du
  nombre de paysan·nes d'environ 20 %. Non confirmé : modalités précises
  d'association des collectivités et du voisinage à la gouvernance.
