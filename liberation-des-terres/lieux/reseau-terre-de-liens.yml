uid: reseau-terre-de-liens
categorie: lieu
nom: "Fermes Terre de Liens"
sous_titre: "Réseau national de fermes sur foncier sanctuarisé"
statut_fiche: publie
forme_juridique: null
localisation: null
annee: 2003
url: "https://terredeliens.org/"
resume: >
  Fiche réseau agrégée. Terre de Liens, mouvement fondé en 2003, porte du
  foncier agricole via la Foncière Terre de Liens ou la Fondation Terre de
  Liens et le confie aux paysan·nes par bail rural, souvent environnemental.
  Au titre de sa collaboration de vingt ans avec les Safer, le mouvement a
  permis à plus de 338 agriculteur·rices de s'installer ou se maintenir sur
  environ 240 fermes couvrant près de 7 000 hectares — un périmètre qui n'est
  qu'un sous-ensemble de l'activité du mouvement. Terre de Liens collecte
  environ 20 millions d'euros par an d'épargne et de dons citoyen·nes.
montage:
  type: propriete_sanctuarisee
  nu_proprietaire: "Foncière Terre de Liens (société en commandite par actions) ou Fondation Terre de Liens (fondation reconnue d'utilité publique)"
  usufruitier: "Titulaire de l'usage : paysan·nes preneur·euses d'un bail rural, souvent bail rural environnemental, dont le renouvellement est d'ordre public"
  description: >
    Les fermes du réseau ont leur foncier acquis grâce à l'épargne citoyenne
    (Foncière) ou aux dons et legs (Fondation). La propriété reste durablement
    portée par ces structures non spéculatives, qui confient l'usage aux
    paysan·nes par bail rural, fréquemment assorti de clauses environnementales.
    Le démembrement strict s'observe surtout pour les donations à la Fondation.
purete_juridique:
  niveau: civil_encadre
  commentaire: >
    Foncier sanctuarisé par des structures non spéculatives (FRUP et société en
    commandite par actions à actionnariat solidaire) ; pureté variable selon le
    porteur, la fondation étant la plus protectrice.
grille:
  - critere: foncier_hors_marche
    valeur: oui
    note: "Le foncier est porté par la Foncière ou la Fondation Terre de Liens et déclaré retiré du marché spéculatif."
  - critere: montage_documente
    valeur: oui
    note: "Le montage portage par la Foncière ou la Fondation puis bail rural aux paysan·nes est public et largement documenté."
  - critere: irreversibilite
    valeur: oui
    note: "La Fondation, reconnue d'utilité publique, et le portage de long terme de la Foncière soustraient durablement le foncier."
  - critere: origine_non_speculative
    valeur: oui
    note: "Le foncier est acquis par épargne solidaire et dons, environ 20 millions d'euros collectés par an."
  - critere: parts_non_cessibles
    valeur: partiel
    note: "Variable selon le porteur : le foncier porté par la Fondation, sans capital appropriable, est verrouillé ; celui porté par la Foncière repose sur des actions cessibles dont la revalorisation rend la valeur partiellement captable."
  - critere: usage_interet_general
    valeur: oui
    note: "L'installation et le maintien de paysan·nes en agriculture servent un intérêt général agricole et alimentaire."
  - critere: non_lucratif_global
    valeur: oui
    note: "Les actions de la Foncière ne versent pas de dividende et la Fondation est non lucrative ; aucune plus-value foncière privée n'est captée."
  - critere: ancrage_territorial
    valeur: oui
    note: "Le réseau couvre toute la France et s'appuie sur des associations territoriales et 20 ans de collaboration avec les Safer."
  - critere: gouvernance_collective
    valeur: partiel
    note: "Le mouvement associe épargnants et bénévoles, mais la place décisionnelle des paysan·nes preneur·euses n'est pas détaillée."
  - critere: tripartisme
    valeur: partiel
    note: "Une fondation ouverte aux collectivités a été créée, mais l'association systématique des pouvoirs publics et du voisinage n'est pas documentée."
  - critere: perennite_gouvernance
    valeur: oui
    note: "Trois structures complémentaires et un mouvement structuré depuis 2003 organisent la continuité."
analyse:
  forces:
    - "Modèle national éprouvé, près de 7 000 hectares portés hors marché."
    - "Fondation reconnue d'utilité publique offrant une forte protection foncière."
    - "Bail rural environnemental inscrivant l'écologie dans le droit du lieu."
  fragilites:
    - "Pureté variable selon le porteur : la Foncière est une structure sociétaire."
    - "Place décisionnelle des paysan·nes preneur·euses peu documentée."
    - "Fiche réseau agrégée : la situation varie d'une ferme à l'autre."
  leviers:
    - "Privilégier le portage par la Fondation pour les situations les plus exposées."
    - "Renforcer la place des paysan·nes dans la gouvernance du mouvement."
    - "Développer la fondation ouverte aux collectivités pour ancrer le tripartisme."
  synthese: >
    Terre de Liens constitue le modèle de référence du portage foncier solidaire
    en France. La fiche agrège un réseau dont la solidité tient à la fondation
    reconnue d'utilité publique et à un usage encadré par bail environnemental.
fiabilite: >
  Faits vérifiés : fondation du mouvement en 2003, chiffres « plus de 338
  agriculteur·rices, environ 240 fermes, près de 7 000 hectares » relevant
  spécifiquement de la collaboration de vingt ans entre Terre de Liens et les
  Safer (et non du total du mouvement), environ 20 millions d'euros collectés
  par an, recours au bail rural environnemental. Non confirmé : total du
  mouvement à jour, situation parcelle par parcelle, fiches individuelles de
  fermes emblématiques.
