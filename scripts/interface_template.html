<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Veille documentaire — Fiches synopsis</title>
<style>
  :root {
    --bg: #1a1a1f; --bg-card: #24242c; --bg-elev: #2e2e38;
    --text: #e8e8ea; --text-dim: #9b9ba5; --text-faint: #6c6c78;
    --accent: #ff8a4c; --accent-dim: #cc5a1c;
    --good: #5ac177; --warn: #e6b04a; --bad: #d05a5a;
    --gold: #d4af37;
    --border: #34343f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
               font-size: 14px; line-height: 1.5; }
  header { padding: 18px 24px; border-bottom: 1px solid var(--border);
           background: var(--bg-card); display: flex; align-items: baseline; gap: 24px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 18px; font-weight: 600; }
  .meta { color: var(--text-dim); font-size: 13px; }
  .layout { display: grid; grid-template-columns: 280px 1fr; gap: 0; min-height: calc(100vh - 60px); }
  aside { padding: 20px; border-right: 1px solid var(--border); background: var(--bg-card);
          position: sticky; top: 60px; max-height: calc(100vh - 60px); overflow-y: auto; }
  aside h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px;
             color: var(--text-faint); font-weight: 600; }
  aside .group { margin-bottom: 24px; }
  aside input[type="text"], aside select {
    width: 100%; padding: 8px 10px; background: var(--bg-elev); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px; font-size: 13px; }
  aside input[type="range"] { width: 100%; }
  aside .range-vals { display: flex; justify-content: space-between; color: var(--text-dim); font-size: 12px; margin-top: 4px; }
  aside label { display: flex; align-items: center; gap: 8px; margin: 6px 0; cursor: pointer; }
  aside .stat { color: var(--text-dim); font-size: 12px; margin-top: 16px; }
  main { padding: 20px 24px; overflow-y: auto; max-height: calc(100vh - 60px); }
  .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar select { padding: 6px 10px; background: var(--bg-elev); color: var(--text);
                    border: 1px solid var(--border); border-radius: 4px; }
  .count { color: var(--text-dim); font-size: 13px; margin-left: auto; }
  .cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); }
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
          padding: 14px 16px; transition: border-color 120ms; cursor: pointer; position: relative; }
  .card:hover { border-color: var(--accent-dim); }
  .card.has-bulle { border-color: var(--gold); }
  .card-head { display: flex; gap: 12px; align-items: flex-start; }
  .cover { flex-shrink: 0; width: 60px; height: 80px; border-radius: 4px;
           background: var(--bg-elev); object-fit: cover; border: 1px solid var(--border); }
  .cover.placeholder { display: flex; align-items: center; justify-content: center;
                       font-size: 22px; color: var(--text-faint); }
  .score { position: absolute; top: 14px; right: 14px;
           min-width: 38px; height: 38px; border-radius: 6px;
           display: flex; align-items: center; justify-content: center;
           font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
  .score.s10, .score.s9 { background: rgba(90, 193, 119, 0.18); color: var(--good); }
  .score.s8, .score.s7  { background: rgba(230, 176, 74, 0.18); color: var(--warn); }
  .score.s6, .score.s5  { background: rgba(154, 154, 165, 0.18); color: var(--text-dim); }
  .score.s4, .score.s3, .score.s2, .score.s1, .score.s0 {
    background: rgba(208, 90, 90, 0.18); color: var(--bad); }
  .title { font-weight: 600; line-height: 1.35; word-break: break-word;
           padding-right: 50px; }
  .filename { color: var(--text-faint); font-size: 12px; font-family: ui-monospace, monospace;
              margin-top: 2px; word-break: break-all; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .badge { font-size: 11px; padding: 2px 7px; border-radius: 3px;
           background: var(--bg-elev); color: var(--text-dim); }
  .badge.dl   { background: rgba(90, 193, 119, 0.18); color: var(--good); }
  .badge.gold { background: rgba(212, 175, 55, 0.20); color: var(--gold); }
  .badge.warn { background: rgba(208, 90, 90, 0.18); color: var(--bad); }
  .raison { margin-top: 10px; color: var(--text-dim); font-size: 13px; font-style: italic; line-height: 1.45; }
  .citation { margin-top: 8px; padding: 8px 10px; background: var(--bg-elev);
              border-left: 3px solid var(--accent); border-radius: 2px;
              font-size: 12px; color: var(--text); white-space: pre-wrap;
              word-break: break-word; max-height: 6em; overflow: hidden; }
  .actions { margin-top: 10px; display: flex; gap: 12px; flex-wrap: wrap; }
  .actions a { color: var(--accent); text-decoration: none; font-size: 12px; }
  .actions a:hover { text-decoration: underline; }
  .empty { text-align: center; color: var(--text-faint); padding: 40px; grid-column: 1 / -1; }

  /* Modal — fiche complète */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.78); display: none;
              z-index: 10; align-items: center; justify-content: center; padding: 20px; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
           max-width: 900px; width: 100%; max-height: 92vh; overflow-y: auto; }
  .modal-head { padding: 24px 28px; border-bottom: 1px solid var(--border);
                display: grid; grid-template-columns: 140px 1fr; gap: 20px; }
  .modal-head img { width: 140px; max-height: 200px; object-fit: contain;
                    background: var(--bg-elev); border-radius: 6px; border: 1px solid var(--border); }
  .modal-head img.placeholder { width: 140px; height: 180px; display: flex;
                                align-items: center; justify-content: center;
                                font-size: 36px; color: var(--text-faint); }
  .modal-head h2 { margin: 0 0 8px; font-size: 20px; }
  .close { float: right; cursor: pointer; color: var(--text-faint); font-size: 28px;
           line-height: 1; padding: 0 8px; user-select: none; }
  .close:hover { color: var(--text); }
  .section { padding: 20px 28px; border-bottom: 1px solid var(--border); }
  .section:last-child { border-bottom: none; }
  .section h3 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase;
                letter-spacing: 0.8px; color: var(--text-faint); font-weight: 600; }
  .section .summary { color: var(--text); line-height: 1.6; white-space: pre-wrap; }
  .cit-list { display: flex; flex-direction: column; gap: 10px; }
  .cit-item { padding: 10px 12px; background: var(--bg-elev); border-left: 3px solid var(--accent);
              border-radius: 2px; font-size: 13px; }
  .cit-item .page-ref { color: var(--accent); font-weight: 600; font-size: 12px; }
  .cit-item .quote { margin-top: 4px; }
  .cit-item .why { margin-top: 6px; color: var(--text-dim); font-style: italic; font-size: 12px; }
  .matched-kw { display: flex; gap: 6px; flex-wrap: wrap; }
  .matched-kw span { padding: 3px 9px; background: rgba(90, 193, 119, 0.15);
                     color: var(--good); border-radius: 3px; font-size: 12px; }
  .bulle { padding: 16px 18px; background: rgba(212, 175, 55, 0.08);
           border: 1px solid rgba(212, 175, 55, 0.4); border-radius: 6px; }
  .bulle .titre-accroche { font-size: 18px; font-weight: 600; color: var(--gold); margin-bottom: 8px; }
  .bulle .teaser { font-style: italic; color: var(--text); margin-bottom: 12px; }
  .bulle .abstract { color: var(--text); line-height: 1.6; white-space: pre-wrap; }
  .bulle .cit-phares { margin-top: 12px; }
  .bulle .tags span { padding: 3px 9px; background: rgba(212, 175, 55, 0.18);
                       color: var(--gold); border-radius: 3px; font-size: 12px; margin-right: 6px; }
  .bulle code { background: var(--bg-elev); padding: 2px 6px; border-radius: 3px; font-size: 12px; }
  .runs-list { display: flex; flex-direction: column; gap: 8px; }
  .run-row { padding: 10px 12px; background: var(--bg-elev); border-radius: 4px; }
</style>
</head>
<body>

<header>
  <h1>📚 Veille documentaire — fiches synopsis</h1>
  <span class="meta" id="meta"></span>
</header>

<div class="layout">

  <aside>
    <div class="group">
      <h3>Recherche</h3>
      <input type="text" id="q" placeholder="Titre, filename, raison…">
    </div>

    <div class="group">
      <h3>Score minimum</h3>
      <input type="range" id="scoreMin" min="0" max="10" value="0">
      <div class="range-vals"><span>0</span><span id="scoreMinVal">0</span><span>10</span></div>
    </div>

    <div class="group">
      <h3>Source</h3>
      <select id="source"><option value="">— toutes —</option></select>
    </div>

    <div class="group">
      <h3>Filtres</h3>
      <label><input type="checkbox" id="onlyDl"> Téléchargés uniquement</label>
      <label><input type="checkbox" id="onlyEnriched"> Avec synopsis enrichi</label>
      <label><input type="checkbox" id="onlyBulle"> Avec bulle de publication</label>
      <label><input type="checkbox" id="onlyMulti"> Vus dans plusieurs runs</label>
    </div>

    <div class="stat" id="stats"></div>
  </aside>

  <main>
    <div class="toolbar">
      <label>Tri :
        <select id="sort">
          <option value="score">Score (décroissant)</option>
          <option value="date">Date (récent → ancien)</option>
          <option value="source">Source</option>
          <option value="filename">Filename</option>
        </select>
      </label>
      <span class="count" id="count"></span>
    </div>
    <div id="cards" class="cards"></div>
  </main>
</div>

<div class="modal-bg" id="modalBg" onclick="if(event.target.id==='modalBg')closeModal()">
  <div class="modal" id="modal"></div>
</div>

<script>
const CATALOG = /*__CATALOG_INJECTED_HERE__*/null;

const docs = Object.values(CATALOG.docs || {});
const sources = [...new Set(docs.map(d => d.source))].sort();

document.getElementById('meta').textContent =
  `${docs.length} docs · ${CATALOG.meta?.total_downloaded || 0} téléchargés · `
  + `dernière maj : ${CATALOG.meta?.last_updated || '?'}`;

const sourceSel = document.getElementById('source');
sources.forEach(s => {
  const o = document.createElement('option'); o.value = s; o.textContent = s;
  sourceSel.appendChild(o);
});

const distrib = CATALOG.meta?.score_distribution || {};
const statsLines = [];
for (let s = 10; s >= 0; s--) {
  if (distrib[s]) statsLines.push(`${s}/10 : ${distrib[s]}`);
}
document.getElementById('stats').innerHTML = '<h3 style="margin-top:0">Distribution</h3>'
  + statsLines.join('<br>');

function render() {
  const q = document.getElementById('q').value.toLowerCase();
  const minScore = +document.getElementById('scoreMin').value;
  const src = document.getElementById('source').value;
  const onlyDl = document.getElementById('onlyDl').checked;
  const onlyEnriched = document.getElementById('onlyEnriched').checked;
  const onlyBulle = document.getElementById('onlyBulle').checked;
  const onlyMulti = document.getElementById('onlyMulti').checked;
  const sort = document.getElementById('sort').value;

  let filtered = docs.filter(d => {
    if (d.latest_score < minScore) return false;
    if (src && d.source !== src) return false;
    if (onlyDl && !d.downloaded) return false;
    if (onlyEnriched && !(d.enrichment && !d.enrichment.error)) return false;
    if (onlyBulle && !d.bulle) return false;
    if (onlyMulti && d.runs.length < 2) return false;
    if (q) {
      const hay = (d.filename + ' ' + d.source + ' '
                   + (d.runs.at(-1)?.link_text || '')
                   + ' ' + (d.runs.at(-1)?.raison || '')
                   + ' ' + (d.enrichment?.summary || '')
                  ).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  if (sort === 'score')         filtered.sort((a,b) => b.latest_score - a.latest_score);
  else if (sort === 'date')     filtered.sort((a,b) => b.latest_run.localeCompare(a.latest_run));
  else if (sort === 'source')   filtered.sort((a,b) => a.source.localeCompare(b.source));
  else if (sort === 'filename') filtered.sort((a,b) => a.filename.localeCompare(b.filename));

  document.getElementById('count').textContent = `${filtered.length} fiche(s) affichée(s)`;

  const cards = document.getElementById('cards');
  cards.innerHTML = '';
  if (filtered.length === 0) {
    cards.innerHTML = '<div class="empty">Aucune fiche ne correspond aux filtres.</div>';
    return;
  }
  for (const d of filtered.slice(0, 400)) {
    cards.appendChild(buildCard(d));
  }
  if (filtered.length > 400) {
    const more = document.createElement('div');
    more.className = 'empty';
    more.textContent = `… ${filtered.length - 400} fiches supplémentaires (affiner les filtres)`;
    cards.appendChild(more);
  }
}

function buildCard(d) {
  const latestRun = d.runs.at(-1) || {};
  const c = document.createElement('div');
  c.className = 'card' + (d.bulle ? ' has-bulle' : '');
  c.onclick = () => openModal(d);
  const coverHtml = d.cover
    ? `<img class="cover" src="${escape(d.cover)}" alt="couverture">`
    : `<div class="cover placeholder">📄</div>`;
  c.innerHTML = `
    <div class="score s${d.latest_score}">${d.latest_score}</div>
    <div class="card-head">
      ${coverHtml}
      <div style="flex:1; min-width:0">
        <div class="title">${escape(latestRun.link_text || d.filename)}</div>
        <div class="filename">${escape(d.filename)}</div>
        <div class="badges">
          <span class="badge">${escape(d.source)}</span>
          <span class="badge">${d.format.toUpperCase()}</span>
          ${d.downloaded ? '<span class="badge dl">téléchargé</span>' : ''}
          ${d.bulle ? '<span class="badge gold">bulle ✨</span>' : ''}
          ${d.download_status && d.download_status.startsWith('failed')
            ? `<span class="badge warn">${escape(d.download_status)}</span>` : ''}
        </div>
      </div>
    </div>
    <div class="raison">${escape(latestRun.raison || '')}</div>
    ${latestRun.context_seen
      ? `<div class="citation" title="Contexte que Claude a vu pour scorer">${escape(latestRun.context_seen)}</div>`
      : ''}
    <div class="actions">
      <a href="${escape(d.url)}" target="_blank" rel="noopener">🌐 source originale</a>
      ${d.downloaded ? `<a href="https://drive.google.com/drive/search?q=${encodeURIComponent(d.filename)}" target="_blank">📁 Drive</a>` : ''}
    </div>
  `;
  return c;
}

function openModal(d) {
  const m = document.getElementById('modal');
  const latest = d.runs.at(-1) || {};
  const enr = d.enrichment || {};
  const bulle = d.bulle ? loadBulle(d.bulle) : null;

  const coverHtml = d.cover
    ? `<img src="${escape(d.cover)}" alt="couverture">`
    : `<div class="placeholder" style="width:140px;height:180px;background:var(--bg-elev);border-radius:6px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:36px;color:var(--text-faint)">📄</div>`;

  let html = `
    <span class="close" onclick="closeModal()">×</span>
    <div class="modal-head">
      ${coverHtml}
      <div>
        <h2>${escape(latest.link_text || d.filename)}</h2>
        <div class="meta">${escape(d.source)} · ${d.format.toUpperCase()} ·
          ${d.meta?.page_count ? d.meta.page_count + ' pages · ' : ''}
          ${d.downloaded ? 'téléchargé' : 'non téléchargé'}
        </div>
        <p><a href="${escape(d.url)}" target="_blank" rel="noopener">🌐 ${escape(d.url)}</a></p>
        ${d.downloaded ? `<p><a href="https://drive.google.com/drive/search?q=${encodeURIComponent(d.filename)}" target="_blank">📁 Ouvrir dans Google Drive</a></p>` : ''}
      </div>
    </div>
  `;

  if (enr.summary) {
    html += `<div class="section">
      <h3>Résumé enrichi (post-lecture par Claude)</h3>
      <div class="summary">${escape(enr.summary)}</div>
      ${enr.relevance_score !== undefined ? `<p style="margin-top:12px; color:var(--text-dim)"><strong>Score post-lecture :</strong> ${enr.relevance_score}/10 — ${escape(enr.relevance_notes || '')}</p>` : ''}
    </div>`;
  }

  if (enr.matched_keywords && enr.matched_keywords.length > 0) {
    html += `<div class="section">
      <h3>Mots-clés réellement présents</h3>
      <div class="matched-kw">${enr.matched_keywords.map(k => `<span>${escape(k)}</span>`).join('')}</div>
    </div>`;
  }

  if (enr.citations && enr.citations.length > 0) {
    html += `<div class="section">
      <h3>Citations clés (avec n° de page)</h3>
      <div class="cit-list">
        ${enr.citations.map(c => `
          <div class="cit-item">
            <span class="page-ref">p. ${c.page || '?'}</span>
            <div class="quote">« ${escape(c.quote_fr || c.quote || '')} »</div>
            ${c.quote_fr && c.quote ? `<div class="quote-orig" style="font-size:0.85em;color:var(--text-dim);margin-top:3px">↳ <em>${escape(c.quote)}</em></div>` : ''}
            ${c.why_relevant ? `<div class="why">→ ${escape(c.why_relevant)}</div>` : ''}
          </div>`).join('')}
      </div>
    </div>`;
  }

  if (bulle) {
    html += `<div class="section">
      <h3>✨ Bulle de publication (pour troisiemesvoix.org)</h3>
      <div class="bulle">
        <div class="titre-accroche">${escape(bulle.titre_accroche || '')}</div>
        <div class="teaser">${escape(bulle.teaser || '')}</div>
        <div class="abstract">${escape(bulle.abstract_editorial || '')}</div>
        ${bulle.citations_phares ? `<div class="cit-phares cit-list" style="margin-top:14px">
          ${bulle.citations_phares.map(c => `<div class="cit-item">
            <span class="page-ref">p. ${c.page || '?'}</span>
            <div class="quote">« ${escape(c.quote || '')} »</div>
          </div>`).join('')}
        </div>` : ''}
        ${bulle.categorisation ? `<div class="tags" style="margin-top:12px">${bulle.categorisation.map(t => `<span>${escape(t)}</span>`).join('')}</div>` : ''}
        ${bulle.slug ? `<p style="margin-top:12px; color:var(--text-dim)">slug : <code>${escape(bulle.slug)}</code></p>` : ''}
      </div>
    </div>`;
  } else if (d.bulle) {
    html += `<div class="section"><h3>✨ Bulle de publication</h3>
      <p style="color:var(--text-dim)">Bulle disponible : <code>${escape(d.bulle)}</code> (chargement async non implémenté localement)</p></div>`;
  }

  html += `<div class="section">
    <h3>Historique de scoring (${d.runs.length} run${d.runs.length>1?'s':''})</h3>
    <div class="runs-list">
      ${d.runs.map(r => `
        <div class="run-row">
          <div><strong>${escape(r.date)}</strong> · score ${r.score}/10</div>
          <div class="raison" style="margin-top:6px">${escape(r.raison)}</div>
          ${r.context_seen ? `<div class="citation">${escape(r.context_seen)}</div>` : ''}
        </div>`).join('')}
    </div>
  </div>`;

  m.innerHTML = html;
  document.getElementById('modalBg').classList.add('open');
}

function loadBulle(_path) { return null; /* fallback : bulle non embedded */ }
function closeModal() { document.getElementById('modalBg').classList.remove('open'); }
function escape(s) { return String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

document.getElementById('q').addEventListener('input', render);
document.getElementById('scoreMin').addEventListener('input', e => {
  document.getElementById('scoreMinVal').textContent = e.target.value;
  render();
});
document.getElementById('source').addEventListener('change', render);
document.getElementById('onlyDl').addEventListener('change', render);
document.getElementById('onlyEnriched').addEventListener('change', render);
document.getElementById('onlyBulle').addEventListener('change', render);
document.getElementById('onlyMulti').addEventListener('change', render);
document.getElementById('sort').addEventListener('change', render);

render();
</script>
</body>
</html>
